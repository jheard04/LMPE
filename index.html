  // already expects (originally backed by Claude's window.storage) — so the
  // app's own code needs ZERO changes. "shared" data goes to Firebase
  // (genuinely shared across every visitor); "personal" data goes to this
  // browser's own localStorage (matching the original per-browser behavior
  // for things like your remembered username).
  window.storage = {
