function AdminGate({ adminPass, adminRecoveryHash, onSetPass, onSetRecoveryHash, onUnlock }) {
  const [input, setInput] = useState("");
  const [confirmInput, setConfirmInput] = useState("");
  const [err, setErr] = useState("");
  const [mode, setMode] = useState("unlock"); // "unlock" | "forgot" | "reveal"
  const [recoveryInput, setRecoveryInput] = useState("");
  const [newPw, setNewPw] = useState("");
  const [newPwConfirm, setNewPwConfirm] = useState("");
  const [revealCode, setRevealCode] = useState("");
  const [copyMsg, setCopyMsg] = useState("");

  const finishSetup = async (password) => {
    const hash = await sha256Hex(password);
    const code = generateRecoveryCode();
    const codeHash = await sha256Hex(code);
    await onSetPass(hash);
    await onSetRecoveryHash(codeHash);
    setRevealCode(code);
    setMode("reveal");
  };

  const copyCode = async () => {
    try { await navigator.clipboard.writeText(revealCode); setCopyMsg("Copied."); }
    catch { setCopyMsg("Couldn't copy — select and copy the text manually."); }
  };

  if (mode === "reveal") {
    return (
      <TicketCard accent="var(--gold)">
        <p className="text-sm mb-2 font-medium" style={{ color: "var(--gold)" }}>Save this recovery code somewhere safe</p>
        <p className="text-xs mb-3" style={{ color: "var(--muted)" }}>This is the only time it will be shown. If you ever forget the admin password, this code is the only way back in — paste it into a password manager, a note, or email it to yourself right now.</p>
        <div className="text-center py-3 mb-3 rounded mono-font text-lg" style={{ background: "var(--bg)", border: "1px dashed var(--gold)", color: "var(--gold)", letterSpacing: "0.1em" }}>
          {revealCode}
        </div>
        <button onClick={copyCode} className="w-full py-2 rounded display-font text-sm mb-2" style={{ background: "var(--surface)", border: "1px solid var(--hairline)", color: "var(--text)" }}>Copy to clipboard</button>
        {copyMsg && <p className="text-xs mb-2" style={{ color: "var(--gold)" }}>{copyMsg}</p>}
        <button onClick={onUnlock} className="w-full py-2 rounded display-font text-sm" style={{ background: "var(--gold)", color: "#12161C" }}>I've saved it — Continue</button>
      </TicketCard>
    );
  }

  if (adminPass == null) {
    return (
      <TicketCard accent="var(--gold)">
        <p className="text-sm mb-3">No admin password has been set yet. Set one and share it with whoever should have admin access.</p>
        <input type="password" value={input} onChange={(e) => setInput(e.target.value)} placeholder="new admin password" className="w-full px-2 py-1.5 rounded text-sm mb-2" style={inputStyle()} />
        <input type="password" value={confirmInput} onChange={(e) => setConfirmInput(e.target.value)} placeholder="confirm password" className="w-full px-2 py-1.5 rounded text-sm mb-2" style={inputStyle()} />
        <button
          onClick={async () => {
            if (!input || input !== confirmInput) { setErr("Passwords don't match."); return; }
            setErr("");
            await finishSetup(input);
          }}
          className="w-full py-2 rounded display-font text-sm" style={{ background: "var(--gold)", color: "#12161C" }}
        >
          Set Admin Password
        </button>
        {err && <p className="text-xs mt-2" style={{ color: "var(--loss)" }}>{err}</p>}
        <p className="text-[11px] mt-2" style={{ color: "var(--muted)" }}>This is a simple shared gate for a casual league, not real account security — anyone with the password gets admin access. Passwords are hashed before being stored, not kept as plain text.</p>
      </TicketCard>
    );
  }

  if (mode === "forgot") {
    return (
      <TicketCard accent="var(--gold)">
        <p className="text-sm mb-3">Enter your recovery code to set a new admin password.</p>
        <input value={recoveryInput} onChange={(e) => setRecoveryInput(e.target.value.toUpperCase())} placeholder="XXXX-XXXX-XXXX" className="w-full px-2 py-1.5 rounded text-sm mb-2 mono-font" style={inputStyle()} />
        <input type="password" value={newPw} onChange={(e) => setNewPw(e.target.value)} placeholder="new admin password" className="w-full px-2 py-1.5 rounded text-sm mb-2" style={inputStyle()} />
        <input type="password" value={newPwConfirm} onChange={(e) => setNewPwConfirm(e.target.value)} placeholder="confirm new password" className="w-full px-2 py-1.5 rounded text-sm mb-2" style={inputStyle()} />
        <button
          onClick={async () => {
            if (!recoveryInput.trim()) { setErr("Enter your recovery code."); return; }
            if (!newPw || newPw !== newPwConfirm) { setErr("Passwords don't match."); return; }
            const enteredHash = await sha256Hex(recoveryInput.trim());
            if (enteredHash !== adminRecoveryHash) { setErr("That recovery code doesn't match."); return; }
            setErr("");
            await finishSetup(newPw);
          }}
          className="w-full py-2 rounded display-font text-sm mb-2" style={{ background: "var(--gold)", color: "#12161C" }}
        >
          Reset Password
        </button>
        <button onClick={() => { setMode("unlock"); setErr(""); }} className="w-full py-2 rounded display-font text-sm" style={{ background: "var(--surface)", color: "var(--muted)" }}>Back</button>
        {err && <p className="text-xs mt-2" style={{ color: "var(--loss)" }}>{err}</p>}
        <p className="text-[11px] mt-2" style={{ color: "var(--muted)" }}>Resetting generates a brand new recovery code — the old one stops working.</p>
      </TicketCard>
    );
  }

  return (
    <TicketCard accent="var(--gold)">
      <p className="text-sm mb-3">Enter the admin password to manage the league.</p>
      <input type="password" value={input} onChange={(e) => setInput(e.target.value)} placeholder="admin password" className="w-full px-2 py-1.5 rounded text-sm mb-2" style={inputStyle()} />
      <button
        onClick={async () => {
          const enteredHash = await sha256Hex(input);
          if (enteredHash === adminPass) { onUnlock(); return; }
          if (input === adminPass) {
            // Legacy plain-text password from before hashing was added — migrate it transparently.
            await finishSetup(input);
            return;
          }
          setErr("Wrong password.");
        }}
        className="w-full py-2 rounded display-font text-sm mb-2" style={{ background: "var(--gold)", color: "#12161C" }}
      >
        Unlock Admin
      </button>
      <button onClick={() => { setMode("forgot"); setErr(""); }} className="w-full text-xs" style={{ color: "var(--muted)" }}>Forgot password?</button>
      {err && <p className="text-xs mt-2" style={{ color: "var(--loss)" }}>{err}</p>}
    </TicketCard>
  );
}

function PicksTab({ identity, week, weekNum, locked, roster, picksData, authed, isArchivedSeason, weekPotValue, onSavePicks }) {
  const existing = (picksData[weekNum] && picksData[weekNum][identity]) || [];
  const [slots, setSlots] = useState(Array.from({ length: PICKS_PER_WEEK }, (_, i) => existing[i] || { id: newId(), gameId: "", type: "spread", selection: "" }));
  const [confirmData, setConfirmData] = useState(null);

  useEffect(() => {
    const ex = (picksData[weekNum] && picksData[weekNum][identity]) || [];
    setSlots(Array.from({ length: PICKS_PER_WEEK }, (_, i) => ex[i] || { id: newId(), gameId: "", type: "spread", selection: "" }));
  }, [weekNum, identity]);

  if (isArchivedSeason) return <EmptyState text="This is an archived season — picks are read-only. Switch to the current season up top to make picks." />;
  if (!week || !week.games || week.games.length === 0) return <EmptyState text="No games have been set for this week yet. Check back once the admin publishes the odds." />;
  if (!identity.trim()) return <EmptyState text="Enter your username up top to make picks." />;
  if (roster.locked && !roster.usernames.includes(identity.trim())) return <EmptyState text="Roster is locked and this username isn't on it. Ask the admin to add you." />;
  if (!authed) return <EmptyState text="Enter your password up top (or set one if this is your first time) to make picks." />;

  const update = (idx, field, value) => {
    setSlots((prev) => {
      const next = [...prev];
      next[idx] = { ...next[idx], [field]: value };
      if (field === "gameId" || field === "type") next[idx].selection = "";
      if (field === "gameId") {
        const otherSlots = prev.filter((_, i) => i !== idx);
        const usedCombos = new Set(otherSlots.filter((s) => s.gameId && s.type).map((s) => `${s.gameId}:${s.type}`));
        if (usedCombos.has(`${value}:${next[idx].type}`)) {
          next[idx].type = usedCombos.has(`${value}:spread`) ? "total" : "spread";
        }
      }
      return next;
    });
  };

  const completeSlots = slots.filter((s) => s.gameId && s.type && s.selection);
  const lockedCompleteSlots = completeSlots.filter((s) => {
    const g = week.games.find((x) => x.id === s.gameId);
    return !g || isGameLocked(g);
  });
  const savableSlots = completeSlots.filter((s) => !lockedCompleteSlots.includes(s));
  const canSave = !locked && savableSlots.length > 0;

  return (
    <div className="space-y-3">
      <p className="text-xs" style={{ color: "var(--muted)" }}>Fill in as few or as many of the 5 slots as you like and submit — you don't need all 5 at once. Anything left blank at the deadline scores as a loss.</p>

      <p className="text-center text-2xl display-font" style={{ color: "var(--gold)" }}>Week {weekNum} of {MAX_WEEKS} — ${Math.round(weekPotValue)}</p>
      <div className="flex items-center justify-center gap-2 text-xs mono-font" style={{ color: "var(--muted)" }}>
        <span>{locked ? "PICKS LOCKED FOR THE WEEK" : `open until ${week.deadline ? new Date(week.deadline).toLocaleString(undefined, { weekday: "short", year: "numeric", month: "numeric", day: "numeric", hour: "numeric", minute: "2-digit" }) : "—"}`}</span>
        <Pill tone={locked ? "loss" : "win"}>{locked ? "closed" : "open"}</Pill>
      </div>

      {slots.map((slot, idx) => {
        const game = week.games.find((g) => g.id === slot.gameId);
        const otherSlots = slots.filter((_, i) => i !== idx);
        const usedCombos = new Set(otherSlots.filter((s) => s.gameId && s.type).map((s) => `${s.gameId}:${s.type}`));
        const options = game ? BET_OPTIONS(game)[slot.type] : [];
        const slotLocked = locked || (game && isGameLocked(game));
        const gameFullyClaimed = (g) => usedCombos.has(`${g.id}:spread`) && usedCombos.has(`${g.id}:total`);
        const optionGames = sortByKickoff(week.games.filter((g) => !gameFullyClaimed(g) || g.id === slot.gameId));
        return (
          <TicketCard key={slot.id} accent="var(--gold)">
            <div className="flex items-center justify-between mb-2">
              <span className="mono-font text-xs" style={{ color: "var(--gold)" }}>PICK {idx + 1}</span>
              {slotLocked && game && isGameLocked(game) && <Pill tone="loss">game started</Pill>}
            </div>
            <div className="grid grid-cols-2 gap-2 mb-2">
              <select disabled={slotLocked} value={slot.gameId} onChange={(e) => update(idx, "gameId", e.target.value)} className="px-2 py-2 rounded text-sm" style={inputStyle()}>
                <option value="">Select game…</option>
                {optionGames.map((g) => (
                  <option key={g.id} value={g.id} disabled={isGameLocked(g) && g.id !== slot.gameId}>
                    {g.label} — {fmtKickoff(g.kickoff)}{isGameLocked(g) ? " (started)" : ""}
                  </option>
                ))}
              </select>
              <select disabled={slotLocked || !slot.gameId} value={slot.type} onChange={(e) => update(idx, "type", e.target.value)} className="px-2 py-2 rounded text-sm" style={inputStyle()}>
                <option value="spread" disabled={usedCombos.has(`${slot.gameId}:spread`)}>Spread{usedCombos.has(`${slot.gameId}:spread`) ? " (already picked)" : ""}</option>
                <option value="total" disabled={usedCombos.has(`${slot.gameId}:total`)}>Over/Under{usedCombos.has(`${slot.gameId}:total`) ? " (already picked)" : ""}</option>
              </select>
            </div>
            <select disabled={slotLocked || !game} value={slot.selection} onChange={(e) => update(idx, "selection", e.target.value)} className="w-full px-2 py-2 rounded text-sm" style={inputStyle()}>
              <option value="">Select pick…</option>
              {options.map((o) => <option key={o.value} value={o.value}>{o.label}</option>)}
            </select>
          </TicketCard>
        );
      })}

      {!locked && (
        <button
          disabled={!canSave}
          onClick={async () => {
            if (isWeekLocked(week)) {
              setConfirmData(null);
              alert("The deadline just passed — picks are now locked for this week.");
              return;
            }
            const isAlreadySaved = (s) => existing.some((e) => e.gameId === s.gameId && e.type === s.type && e.selection === s.selection);
            const freshlyLocked = completeSlots.filter((s) => {
              const g = week.games.find((x) => x.id === s.gameId);
              return g && isGameLocked(g) && !isAlreadySaved(s);
            });
            if (freshlyLocked.length > 0) {
              setConfirmData(null);
              alert("One of your picks is on a game that just started. Please review your picks and save again.");
              return;
            }
            await onSavePicks(completeSlots);
            const summary = slots.map((s, i) => {
              if (!s.gameId || !s.type || !s.selection) return { num: i + 1, filled: false };
              const g = week.games.find((x) => x.id === s.gameId);
              const opt = g ? BET_OPTIONS(g)[s.type].find((o) => o.value === s.selection) : null;
              return { num: i + 1, filled: true, text: `${g?.label || "?"} — ${opt?.label || s.selection}` };
            });
            setConfirmData(summary);
          }}
          className="w-full py-3 rounded-md display-font font-semibold text-sm" style={canSave || completeSlots.length === 0 ? { background: "var(--gold)", color: "#12161C" } : { background: "var(--surface)", color: "var(--muted)" }}
        >
          {canSave
            ? `Submit ${completeSlots.length} Pick${completeSlots.length === 1 ? "" : "s"}`
            : completeSlots.length === 0
            ? "Fill in at least one pick to submit"
            : "That game has already started — pick a different game"}
        </button>
      )}

      {confirmData != null && (
        <div className="fixed inset-0 z-50 flex items-center justify-center px-4" style={{ background: "rgba(0,0,0,0.55)" }} onClick={() => setConfirmData(null)}>
          <div className="rounded-lg p-6" style={{ background: "var(--surface)", border: "2px solid var(--gold)", minWidth: 260, maxWidth: 360 }} onClick={(e) => e.stopPropagation()}>
            <div className="text-center mb-3">
              <div className="text-3xl mb-1" style={{ color: "var(--win)" }}>✓</div>
              <p className="display-font text-lg" style={{ color: "var(--gold)" }}>Picks Submitted</p>
            </div>
            <div className="space-y-1.5 mb-3">
              {confirmData.map((s) => (
                <div key={s.num} className="text-xs mono-font flex gap-2">
                  <span style={{ color: "var(--gold)" }}>Pick {s.num}:</span>
                  {s.filled ? <span style={{ color: "var(--text)" }}>{s.text}</span> : <span style={{ color: "var(--muted)" }}>not yet picked</span>}
                </div>
              ))}
            </div>
            <p className="text-[11px] text-center mb-3" style={{ color: "var(--muted)" }}>
              {confirmData.filter((s) => !s.filled).length === 0
                ? "All 5 picks are in."
                : `${confirmData.filter((s) => !s.filled).length} of 5 still open — deadline is ${fmtMountainTime(week.deadline)}.`}
            </p>
            <button onClick={() => setConfirmData(null)} className="w-full py-2 rounded-md display-font font-semibold text-sm" style={{ background: "var(--gold)", color: "#12161C" }}>
              OK
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

function LeaderboardTab({ standings }) {
  const [sortKey, setSortKey] = useState("wins");
  const [dir, setDir] = useState(-1);

  const rows = [...standings.rows].sort((a, b) => {
    if (sortKey === "pct") {
      const ap = a.wins + a.losses ? a.wins / (a.wins + a.losses) : 0;
      const bp = b.wins + b.losses ? b.wins / (b.wins + b.losses) : 0;
      return (ap - bp) * dir;
    }
    return (a[sortKey] - b[sortKey]) * dir;
  });

  const cols = [["teamName", "Team"], ["wins", "W"], ["losses", "L"], ["pct", "Win %"], ["totalWon", "Earnings"]];
  const setSort = (k) => { if (k === sortKey) setDir((d) => -d); else { setSortKey(k); setDir(-1); } };

  if (rows.length === 0) return <EmptyState text="No one's on the roster yet." />;

  return (
    <div>
      {standings.carryPot > 0 && (
        <div className="mb-3 text-xs mono-font px-2 py-2 rounded" style={{ background: "rgba(212,175,55,0.12)", color: "var(--gold)" }}>
          Carryover pot: ${standings.carryPot.toFixed(2)} rolling into next scored week
        </div>
      )}
      {standings.oferPotTotal > 0 && (
        <div className="mb-3 text-xs mono-font px-2 py-2 rounded" style={{ background: "rgba(192,82,75,0.12)", color: "var(--loss)" }}>
          O-fer pot: ${standings.oferPotTotal.toFixed(2)} accumulated — separate from the weekly pot, settled separately
        </div>
      )}
      <div className="overflow-x-auto rounded-md" style={{ border: "1px solid var(--hairline)" }}>
        <table className="w-full text-sm">
          <thead>
            <tr style={{ background: "var(--surface)" }}>
              {cols.map(([k, label]) => (
                <th key={k} onClick={() => setSort(k)} className="px-2 py-2 text-left cursor-pointer select-none display-font text-xs uppercase tracking-wide" style={{ color: sortKey === k ? "var(--gold)" : "var(--muted)" }}>
                  {label} {sortKey === k ? (dir === 1 ? "↑" : "↓") : ""}
                </th>
              ))}
              <th onClick={() => setSort("oferOwed")} className="px-2 py-2 text-left cursor-pointer select-none display-font text-xs uppercase tracking-wide" style={{ color: sortKey === "oferOwed" ? "var(--gold)" : "var(--muted)" }}>
                O-fer {sortKey === "oferOwed" ? (dir === 1 ? "↑" : "↓") : ""}
              </th>
              <th className="px-2 py-2 text-left display-font text-xs uppercase tracking-wide" style={{ color: "var(--muted)" }}>Wks Won</th>
            </tr>
          </thead>
          <tbody className="mono-font">
            {rows.map((r, i) => {
              const pct = r.wins + r.losses ? Math.round((r.wins / (r.wins + r.losses)) * 100) : 0;
              return (
                <tr key={r.username} style={{ borderTop: "1px solid var(--hairline)", background: i % 2 ? "rgba(255,255,255,0.02)" : "transparent" }}>
                  <td className="px-2 py-2 font-sans font-medium">{r.teamName}</td>
                  <td className="px-2 py-2" style={{ color: "var(--win)" }}>{r.wins}</td>
                  <td className="px-2 py-2" style={{ color: "var(--loss)" }}>{r.losses}</td>
                  <td className="px-2 py-2">{pct}%</td>
                  <td className="px-2 py-2" style={{ color: r.totalWon > 0 ? "var(--gold)" : "var(--text)" }}>${r.totalWon.toFixed(2)}</td>
                  <td className="px-2 py-2" style={{ color: r.oferOwed > 0 ? "var(--loss)" : "var(--text)" }}>${r.oferOwed.toFixed(2)}</td>
                  <td className="px-2 py-2" style={{ color: "var(--gold)" }}>{r.wonWeeks.length > 0 ? r.wonWeeks.map((w) => `Wk ${w}`).join(", ") : "—"}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function HistoryTab({ weeksData, picksData, roster, historyWeek, setHistoryWeek, standings, identity, authed }) {
  const weekNums = Object.keys(weeksData).map(Number).sort((a, b) => a - b);
  const effectiveWeek = weekNums.includes(historyWeek) ? historyWeek : weekNums[weekNums.length - 1];
  const week = weeksData[effectiveWeek];
  const weekLocked = isWeekLocked(week);
  const leagueStat = standings.weeklyLeagueStats[effectiveWeek];

  if (weekNums.length === 0) return <EmptyState text="No weeks have been created yet." />;

  return (
    <div>
      <div className="mb-4 text-center">
        <select
          value={effectiveWeek}
          onChange={(e) => setHistoryWeek(Number(e.target.value))}
          className="text-center text-2xl display-font px-3 py-1 rounded"
          style={{ color: "var(--gold)", background: "var(--bg)", border: "1px solid var(--gold)" }}
        >
          {weekNums.map((wn) => <option key={wn} value={wn}>Week {wn}</option>)}
        </select>
      </div>

      {leagueStat && (
        <div className="mb-4 text-xs mono-font px-3 py-2 rounded" style={{ background: "rgba(212,175,55,0.1)", color: "var(--gold)" }}>
          League week accuracy: {leagueStat.correct}/{leagueStat.total} ({leagueStat.pct.toFixed(1)}%)
        </div>
      )}

      {!weekLocked && (
        <p className="text-[11px] mb-3" style={{ color: "var(--muted)" }}>Other players' picks reveal one at a time — as soon as a game starts, everyone's pick on that game becomes visible. Anything not yet revealed shows all at once at the deadline. You can always see your own picks below.</p>
      )}

      <div className="space-y-4">
        {roster.usernames.map((u) => {
          const isOwnRow = !!authed && identity.trim() === u;
          const userPicks = (picksData[effectiveWeek] && picksData[effectiveWeek][u]) || [];
          return (
            <TicketCard key={u}>
              <div className="mb-2 font-medium display-font">
                {roster.teamNames?.[u] || u} <span className="text-xs mono-font" style={{ color: "var(--muted)" }}>({u})</span>
                {isOwnRow && <span className="ml-2"><Pill tone="win">you</Pill></span>}
              </div>
              {userPicks.length === 0 && weekLocked ? (
                <div className="text-xs mono-font" style={{ color: "var(--loss)" }}>No picks submitted — counted as 5 losses.</div>
              ) : (
                <table className="w-full text-xs mono-font">
                  <tbody>
                    {userPicks.map((p) => {
                      const game = week.games.find((g) => g.id === p.gameId);
                      if (!game) return null;
                      if (!isOwnRow && !isPickRevealed(game, week)) {
                        return (
                          <tr key={p.id} style={{ borderTop: "1px solid var(--hairline)" }}>
                            <td className="py-1.5 pr-2" style={{ color: "var(--muted)" }}>{game.label}</td>
                            <td className="py-1.5 pr-2" style={{ color: "var(--muted)" }}>not revealed yet</td>
                            <td className="py-1.5"><Pill tone="pending">hidden</Pill></td>
                          </tr>
                        );
                      }
                      const opt = BET_OPTIONS(game)[p.type].find((o) => o.value === p.selection);
                      const outcome = scorePick(p, game);
                      return (
                        <tr key={p.id} style={{ borderTop: "1px solid var(--hairline)" }}>
                          <td className="py-1.5 pr-2" style={{ color: "var(--muted)" }}>{game.label}</td>
                          <td className="py-1.5 pr-2">{opt?.label}</td>
                          <td className="py-1.5"><Pill tone={outcome}>{outcome}</Pill></td>
                        </tr>
                      );
                    })}
                    {Array.from({ length: Math.max(0, PICKS_PER_WEEK - userPicks.length) }).map((_, i) =>
                      weekLocked ? (
                        <tr key={`miss-${i}`} style={{ borderTop: "1px solid var(--hairline)" }}>
                          <td className="py-1.5 pr-2" style={{ color: "var(--muted)" }}>—</td>
                          <td className="py-1.5 pr-2" style={{ color: "var(--muted)" }}>no pick</td>
                          <td className="py-1.5"><Pill tone="loss">loss</Pill></td>
                        </tr>
                      ) : isOwnRow ? (
                        <tr key={`miss-${i}`} style={{ borderTop: "1px solid var(--hairline)" }}>
                          <td className="py-1.5 pr-2" style={{ color: "var(--muted)" }}>—</td>
                          <td className="py-1.5 pr-2" style={{ color: "var(--muted)" }}>not yet picked</td>
                          <td className="py-1.5"><Pill tone="pending">open</Pill></td>
                        </tr>
                      ) : (
                        <tr key={`miss-${i}`} style={{ borderTop: "1px solid var(--hairline)" }}>
                          <td className="py-1.5 pr-2" style={{ color: "var(--muted)" }}>—</td>
                          <td className="py-1.5 pr-2" style={{ color: "var(--muted)" }}>not revealed yet</td>
                          <td className="py-1.5"><Pill tone="pending">hidden</Pill></td>
                        </tr>
                      )
                    )}
                  </tbody>
                </table>
              )}
            </TicketCard>
          );
        })}
      </div>
    </div>
  );
}

function AdminTab({ meta, roster, weeksData, picksData, ledger, standings, passwords, onPasswordsChange, seasons, onSeasonsChange, viewingSeasonId, onSwitchSeason, onSetAdminPass, onSetAdminRecoveryHash, onSetCurrentWeek, onRosterChange, onWeeksChange, onPicksChange, onLedgerChange, comments, onCommentsChange, flash }) {
  const [newUser, setNewUser] = useState("");
  const [commentsDraft, setCommentsDraft] = useState(comments);
  useEffect(() => { setCommentsDraft(comments); }, [comments]);
  const [commentsMsg, setCommentsMsg] = useState("");
  const [gameForm, setGameForm] = useState({ teamA: "", teamB: "", spreadA: "", total: "", kickoff: "" });
  const [oddsApiKey, setOddsApiKey] = useState("");
  const [pastePayload, setPastePayload] = useState("");
  const [fetchMsg, setFetchMsg] = useState("");
  const [adjForm, setAdjForm] = useState({ username: "", field: "paid", amount: "", note: "" });
  const [exportPreview, setExportPreview] = useState(null);
  const [pwFormUser, setPwFormUser] = useState("");
  const [pwFormValue, setPwFormValue] = useState("");
  const [pwFormMsg, setPwFormMsg] = useState("");
  const [newSeasonName, setNewSeasonName] = useState("");
  const [seasonMsg, setSeasonMsg] = useState("");
  const [confirmDeleteSeasonId, setConfirmDeleteSeasonId] = useState(null);

  const resetPassword = async (u) => {
    const next = { ...passwords };
    delete next[u];
    await onPasswordsChange(next);
    flash(`${u}'s password cleared — they'll set a new one next time they enter it.`);
  };
  const setPasswordDirect = async () => {
    if (!pwFormUser || !pwFormValue) { setPwFormMsg("Pick a player and enter a password."); return; }
    const hash = await sha256Hex(pwFormValue);
    await onPasswordsChange({ ...(passwords || {}), [pwFormUser]: hash });
    setPwFormMsg(`Password set for ${pwFormUser}. Share it with them directly.`);
    setPwFormValue("");
  };
  const startNewSeason = async () => {
    const name = newSeasonName.trim();
    if (!name) { setSeasonMsg("Give the new season a name."); return; }
    const id = `season-${Date.now()}`;
    const nextList = [...seasons.list, { id, name, createdAt: new Date().toISOString() }];
    await onSeasonsChange({ list: nextList, activeSeasonId: id });
    setNewSeasonName("");
    setSeasonMsg(`${name} started — this is now the active season everyone picks in.`);
    onSwitchSeason(id);
  };
  const deleteSeason = async (id) => {
    if (seasons.list.length <= 1) { setSeasonMsg("You need at least one season — can't delete the only one."); return; }
    if (confirmDeleteSeasonId !== id) { setConfirmDeleteSeasonId(id); return; }
    const target = seasons.list.find((s) => s.id === id);
    const nextList = seasons.list.filter((s) => s.id !== id);
    const nextActive = seasons.activeSeasonId === id ? nextList[0].id : seasons.activeSeasonId;
    await onSeasonsChange({ list: nextList, activeSeasonId: nextActive });
    const keys = seasonKeys(id);
    await Promise.all([
      saveJSON(keys.meta, { currentWeek: 1 }),
      saveJSON(keys.roster, { usernames: [], teamNames: {}, locked: false, pinnedCount: null }),
      saveJSON(keys.weeks, {}),
      saveJSON(keys.picks, {}),
      saveJSON(keys.ledger, { adjustments: [] }),
    ]);
    if (viewingSeasonId === id) onSwitchSeason(nextActive);
    setConfirmDeleteSeasonId(null);
    setSeasonMsg(`"${target.name}" deleted.`);
  };

  const weekNums = Object.keys(weeksData).map(Number).sort((a, b) => a - b);
  const seasonName = seasons.list.find((s) => s.id === viewingSeasonId)?.name || "Season";
  const editWeek = weeksData[meta.currentWeek] || { games: [], deadline: "", locked: false };
  const saveWeek = (patch) => onWeeksChange({ ...weeksData, [meta.currentWeek]: { ...editWeek, ...patch } });

  const addGame = () => {
    if (!gameForm.teamA || !gameForm.teamB) return;
    const g = { id: newId(), teamA: gameForm.teamA, teamB: gameForm.teamB, spreadA: gameForm.spreadA, total: gameForm.total, kickoff: gameForm.kickoff ? new Date(gameForm.kickoff).toISOString() : "", label: `${gameForm.teamA} @ ${gameForm.teamB}`, finalScoreA: null, finalScoreB: null };
    const allGames = [...(editWeek.games || []), g];
    const patch = { games: allGames };
    if (!editWeek.deadline) {
      const derived = deadlineFromGames(allGames);
      if (derived) patch.deadline = derived;
    }
    saveWeek(patch);
    setGameForm({ teamA: "", teamB: "", spreadA: "", total: "", kickoff: "" });
    flash("Game added.");
  };
  const removeGame = (id) => saveWeek({ games: editWeek.games.filter((g) => g.id !== id) });
  const updateGame = (id, patch) => saveWeek({ games: editWeek.games.map((g) => (g.id === id ? { ...g, ...patch } : g)) });
  const [confirmClearGames, setConfirmClearGames] = useState(false);
  useEffect(() => { setConfirmClearGames(false); }, [meta.currentWeek]);
  const clearAllGames = () => {
    if (!confirmClearGames) { setConfirmClearGames(true); return; }
    saveWeek({ games: [], deadline: "" });
    setConfirmClearGames(false);
    flash(`All games cleared for Week ${meta.currentWeek} — deadline reset too, so it'll re-derive correctly from your next import.`);
  };

  const [importFrom, setImportFrom] = useState("");
  const [importTo, setImportTo] = useState("");
  const [importConfirmed, setImportConfirmed] = useState(false);
  useEffect(() => { setImportConfirmed(false); }, [meta.currentWeek]);

  const importOddsFromEvents = (events) => {
    if (!importFrom || !importTo) { setFetchMsg("Set both dates in the range before importing."); return; }
    const fromMs = new Date(importFrom).getTime();
    const toMs = new Date(importTo).getTime();
    const filtered = events.filter((ev) => {
      const t = new Date(ev.commence_time).getTime();
      return t >= fromMs && t <= toMs;
    });
    const games = filtered.map((ev) => {
      const bk = ev.bookmakers?.[0];
      const spreadsMkt = bk?.markets?.find((m) => m.key === "spreads");
      const totalsMkt = bk?.markets?.find((m) => m.key === "totals");
      const away = ev.away_team, home = ev.home_team;
      const spreadOutcome = spreadsMkt?.outcomes?.find((o) => o.name === away);
      const totalOutcome = totalsMkt?.outcomes?.[0];
      return {
        id: newId(), oddsApiEventId: ev.id, teamA: away, teamB: home,
        spreadA: spreadOutcome?.point ?? "", total: totalOutcome?.point ?? "",
        kickoff: ev.commence_time || "", label: `${away} @ ${home}`, finalScoreA: null, finalScoreB: null,
      };
    });
    const allGames = [...(editWeek.games || []), ...games];
    const patch = { games: allGames };
    if (!editWeek.deadline) {
      const derived = deadlineFromGames(allGames);
      if (derived) patch.deadline = derived;
    }
    saveWeek(patch);
    const skipped = events.length - filtered.length;
    const deadlineNote = patch.deadline ? ` Deadline auto-set to Sun 10am MT of that week.` : "";
    setFetchMsg(`Imported ${games.length} games${skipped > 0 ? ` (${skipped} outside the date range were skipped)` : ""}.${deadlineNote}`);
  };

  const fetchOddsLive = async () => {
    setFetchMsg("Fetching…");
    try {
      const res = await fetch(`https://api.the-odds-api.com/v4/sports/americanfootball_nfl/odds?apiKey=${encodeURIComponent(oddsApiKey)}&regions=us&markets=spreads,totals&oddsFormat=american`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const events = await res.json();
      importOddsFromEvents(events);
    } catch (e) {
      setFetchMsg(`Live fetch failed (${e.message}). Paste the API response JSON below instead.`);
    }
  };
  const importPastedOdds = () => {
    try {
      importOddsFromEvents(JSON.parse(pastePayload));
      setPastePayload("");
    } catch (e) {
      setFetchMsg(`Couldn't parse that JSON: ${e.message}`);
    }
  };

  const applyScores = (scoresPayload) => {
    let games = editWeek.games || [];
    scoresPayload.forEach((sc) => {
      if (!sc.completed || !sc.scores) return;
      const idx = games.findIndex((g) => g.oddsApiEventId === sc.id || (g.teamA === sc.away_team && g.teamB === sc.home_team));
      if (idx === -1) return;
      const scoreA = sc.scores.find((s) => s.name === sc.away_team)?.score;
      const scoreB = sc.scores.find((s) => s.name === sc.home_team)?.score;
      games = games.map((g, i) => (i === idx ? { ...g, finalScoreA: scoreA ?? g.finalScoreA, finalScoreB: scoreB ?? g.finalScoreB } : g));
    });
    saveWeek({ games });
    setFetchMsg("Scores applied.");
  };
  const fetchScoresLive = async () => {
    setFetchMsg("Fetching…");
    try {
      const res = await fetch(`https://api.the-odds-api.com/v4/sports/americanfootball_nfl/scores?apiKey=${encodeURIComponent(oddsApiKey)}&daysFrom=3`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      applyScores(await res.json());
    } catch (e) {
      setFetchMsg(`Live fetch failed (${e.message}). Paste the API response JSON below instead.`);
    }
  };
  const importPastedScores = () => {
    try { applyScores(JSON.parse(pastePayload)); setPastePayload(""); }
    catch (e) { setFetchMsg(`Couldn't parse that JSON: ${e.message}`); }
  };

  const lockRosterAndPin = () => onRosterChange({ ...roster, locked: true, pinnedCount: roster.usernames.length });

  const buildWeekPicksRows = () => {
    const week = weeksData[meta.currentWeek];
    if (!week) return null;
    const headers = ["Team", "Game", "Bet Type", "Selection", "Outcome"];
    const rows = [];
    roster.usernames.forEach((u) => {
      const picks = (picksData[meta.currentWeek] && picksData[meta.currentWeek][u]) || [];
      if (picks.length === 0) {
        rows.push([roster.teamNames?.[u] || u, "", "", "no pick", "loss"]);
      } else {
        picks.slice(0, PICKS_PER_WEEK).forEach((p) => {
          const game = week.games.find((g) => g.id === p.gameId);
          if (!game) return;
          const opt = BET_OPTIONS(game)[p.type].find((o) => o.value === p.selection);
          const outcome = scorePick(p, game);
          rows.push([roster.teamNames?.[u] || u, game.label, p.type === "spread" ? "Spread" : "Over/Under", opt?.label || p.selection, outcome]);
        });
      }
      for (let i = picks.length; i < PICKS_PER_WEEK; i++) {
        rows.push([roster.teamNames?.[u] || u, "", "", "no pick", "loss"]);
      }
      rows.push(["", "", "", "", ""]);
    });
    return { headers, rows };
  };

  const exportWeekXlsx = () => {
    const built = buildWeekPicksRows();
    if (!built) return;
    const filename = `${seasonName}-week${meta.currentWeek}-picks.xlsx`;
    const outcomeCol = built.headers.indexOf("Outcome");
    const styleForCell = (rowIdx, colIdx, val) => {
      if (colIdx !== outcomeCol) return 0;
      if (val === "win") return 2; // green fill
      if (val === "loss") return 3; // red fill
      return 0;
    };
    const ok = tryDownloadXlsx(filename, built.headers, built.rows, styleForCell);
    setExportPreview({ filename, csv: null, note: "Excel file — wins are shaded green, losses red. If the download didn't drop, try the button again; this file type can't be pasted as text." });
    flash(ok ? "Colored Excel file downloaded." : "Download was blocked — try clicking the button again.");
  };

  const exportSeasonXlsx = () => {
    const headers = ["Username", "Team", "Wins", "Losses", "Win %", "Owed", "Earnings", "O-fer", "Balance", "Weeks Won"];
    const rows = standings.rows.map((r) => {
      const pctFraction = r.wins + r.losses ? r.wins / (r.wins + r.losses) : 0;
      const balance = r.totalWon - r.totalPaid - r.oferOwed;
      return [
        r.username, r.teamName, r.wins, r.losses, pctFraction,
        r.totalPaid, r.totalWon, r.oferOwed, balance,
        r.wonWeeks.map((w) => `Wk ${w}`).join(" / "),
      ];
    });

    const totalWins = standings.rows.reduce((a, r) => a + r.wins, 0);
    const totalLosses = standings.rows.reduce((a, r) => a + r.losses, 0);
    const totalOwed = standings.rows.reduce((a, r) => a + r.totalPaid, 0);
    const totalEarnings = standings.rows.reduce((a, r) => a + r.totalWon, 0);
    const totalOfer = standings.rows.reduce((a, r) => a + r.oferOwed, 0);
    const totalBalance = totalEarnings - totalOwed - totalOfer;
    const cumulativePct = totalWins + totalLosses ? totalWins / (totalWins + totalLosses) : 0;
    rows.push(["TOTAL", "", totalWins, totalLosses, cumulativePct, totalOwed, totalEarnings, totalOfer, totalBalance, ""]);
    const totalsRowIdx = rows.length - 1;

    const pctCol = headers.indexOf("Win %");
    const owedCol = headers.indexOf("Owed");
    const earningsCol = headers.indexOf("Earnings");
    const oferCol = headers.indexOf("O-fer");
    const balanceCol = headers.indexOf("Balance");
    const styleForCell = (rowIdx, colIdx, val) => {
      const isTotals = rowIdx === totalsRowIdx;
      if (colIdx === pctCol) return isTotals ? 9 : 7; // percent format, bold on totals row
      if (colIdx === owedCol) return isTotals ? 8 : val > 0 ? 6 : 4; // money, red if owed
      if (colIdx === earningsCol) return isTotals ? 8 : val > 0 ? 5 : 4; // money, green if earned
      if (colIdx === oferCol) return isTotals ? 8 : val > 0 ? 6 : 4; // money, red if owed
      if (colIdx === balanceCol) return isTotals ? 8 : val > 0 ? 5 : val < 0 ? 6 : 4; // money, net position
      return isTotals ? 1 : 0; // bold on totals row (Username/Wins/Losses/etc.)
    };
    const filename = `${seasonName}-season-to-date.xlsx`;
    const ok = tryDownloadXlsx(filename, headers, rows, styleForCell);
    setExportPreview({ filename, csv: null, note: "Excel file — money owed is shaded red, earnings and a positive balance are shaded green. This file type can't be pasted as text; try the download button again if it didn't drop." });
    flash(ok ? "Colored Excel file downloaded." : "Download was blocked — try clicking the button again.");
  };

  const addAdjustment = () => {
    if (!adjForm.username || !adjForm.amount) return;
    const adj = { id: newId(), ...adjForm, amount: Number(adjForm.amount) };
    onLedgerChange({ adjustments: [...(ledger.adjustments || []), adj] });
    setAdjForm({ username: "", field: "paid", amount: "", note: "" });
  };
  const removeAdjustment = (id) => onLedgerChange({ adjustments: (ledger.adjustments || []).filter((a) => a.id !== id) });

  const seedTestData = () => {
    const now = Date.now();
    const pastKickoff = new Date(now - 15 * 60000).toISOString(); // already started -> tests per-game lock
    const futureKickoff1 = new Date(now + 60 * 60000).toISOString();
    const futureKickoff2 = new Date(now + 90 * 60000).toISOString();
    const deadline = new Date(now + 3 * 60000).toISOString(); // locks the whole week 3 min from now

    const g1 = { id: newId(), teamA: "Ravens", teamB: "Bengals", spreadA: -3.5, total: 44.5, kickoff: pastKickoff, label: "Ravens @ Bengals", finalScoreA: 27, finalScoreB: 20 };
    const g2 = { id: newId(), teamA: "Cowboys", teamB: "Eagles", spreadA: 2.5, total: 47.5, kickoff: futureKickoff1, label: "Cowboys @ Eagles", finalScoreA: null, finalScoreB: null };
    const g3 = { id: newId(), teamA: "Packers", teamB: "Vikings", spreadA: -6, total: 41, kickoff: futureKickoff2, label: "Packers @ Vikings", finalScoreA: null, finalScoreB: null };
    const week1 = { games: [g1, g2, g3], deadline, locked: false };

    const newRoster = {
      usernames: ["alice", "bob", "carol"],
      teamNames: { alice: "Alice's Aces", bob: "Bob's Bombers", carol: "Carol's Crew" },
      locked: false,
      pinnedCount: null,
    };

    const alicePicks = [
      { id: newId(), gameId: g1.id, type: "spread", selection: "teamA" }, // Ravens -3.5, final 27-20 -> covers, WIN
      { id: newId(), gameId: g1.id, type: "total", selection: "over" }, // 47 total vs 44.5 line -> WIN
      { id: newId(), gameId: g2.id, type: "spread", selection: "teamB" },
      { id: newId(), gameId: g2.id, type: "total", selection: "under" },
      { id: newId(), gameId: g3.id, type: "spread", selection: "teamA" },
    ];
    const bobPicks = [
      { id: newId(), gameId: g1.id, type: "spread", selection: "teamB" }, // Bengals didn't cover -> LOSS
      { id: newId(), gameId: g1.id, type: "total", selection: "under" }, // LOSS
      { id: newId(), gameId: g2.id, type: "spread", selection: "teamA" },
      // only 3 picks submitted on purpose -> 2 missing slots score as losses
    ];
    const carolPicks = [
      { id: newId(), gameId: g1.id, type: "spread", selection: "teamA" }, // WIN
      { id: newId(), gameId: g1.id, type: "total", selection: "over" }, // WIN
      { id: newId(), gameId: g2.id, type: "spread", selection: "teamB" },
      { id: newId(), gameId: g2.id, type: "total", selection: "over" },
      { id: newId(), gameId: g3.id, type: "spread", selection: "teamB" },
    ];

    onWeeksChange({ ...weeksData, 1: week1 });
    onRosterChange(newRoster);
    onSetCurrentWeek(1);
    onPicksChange({ ...picksData, 1: { alice: alicePicks, bob: bobPicks, carol: carolPicks } });
    (async () => {
      const hash = await sha256Hex("testpass");
      await onPasswordsChange({ ...(passwords || {}), alice: hash, bob: hash, carol: hash });
    })();
    flash("Test data loaded: 3 games (one already final), 3 players (password: testpass), week locks in ~3 min.");
  };

  const [confirmClearAll, setConfirmClearAll] = useState(false);
  const clearAllData = () => {
    if (!confirmClearAll) { setConfirmClearAll(true); return; }
    onRosterChange({ usernames: [], teamNames: {}, locked: false, pinnedCount: null });
    onWeeksChange({});
    onPicksChange({});
    onLedgerChange({ adjustments: [] });
    onSetCurrentWeek(1);
    setConfirmClearAll(false);
    flash(`All data cleared for "${seasonName}".`);
  };

  const [newAdminPw, setNewAdminPw] = useState("");
  const [newAdminPwConfirm, setNewAdminPwConfirm] = useState("");
  const [adminPwMsg, setAdminPwMsg] = useState("");
  const [newRecoveryCode, setNewRecoveryCode] = useState("");
  const changeAdminPassword = async () => {
    if (!newAdminPw || newAdminPw !== newAdminPwConfirm) { setAdminPwMsg("Passwords don't match."); return; }
    const hash = await sha256Hex(newAdminPw);
    const code = generateRecoveryCode();
    const codeHash = await sha256Hex(code);
    await onSetAdminPass(hash);
    await onSetAdminRecoveryHash(codeHash);
    setNewAdminPw("");
    setNewAdminPwConfirm("");
    setNewRecoveryCode(code);
    setAdminPwMsg("");
  };

  return (
    <div className="space-y-6">
      <Section title="Banner Updates">
        <textarea
          value={commentsDraft}
          onChange={(e) => setCommentsDraft(e.target.value)}
          placeholder="e.g. Week 3 games are up — deadline is Sunday 10am MT as usual. Good luck!"
          rows={4}
          className="w-full px-2 py-1.5 rounded text-sm mb-2"
          style={inputStyle()}
        />
        <button
          onClick={async () => { await onCommentsChange(commentsDraft); setCommentsMsg("Saved."); setTimeout(() => setCommentsMsg(""), 2000); }}
          className="w-full py-2 rounded text-sm display-font" style={{ background: "var(--gold)", color: "#12161C" }}
        >
          Save Comments
        </button>
        {commentsMsg && <p className="text-[11px] mt-1" style={{ color: "var(--gold)" }}>{commentsMsg}</p>}
      </Section>

      <Section title="Season Management">
        <div className="mb-3">
          <label className="block text-[10px] uppercase tracking-wider mb-1" style={{ color: "var(--muted)" }}>Viewing / editing season</label>
          <select value={viewingSeasonId} onChange={(e) => onSwitchSeason(e.target.value)} className="w-full px-2 py-1.5 rounded text-sm" style={inputStyle()}>
            {seasons.list.map((s) => (
              <option key={s.id} value={s.id}>{s.name}{s.id === seasons.activeSeasonId ? " (current)" : ""}</option>
            ))}
          </select>
          {viewingSeasonId !== seasons.activeSeasonId && (
            <p className="text-[11px] mt-1" style={{ color: "var(--gold)" }}>You're editing a past season. Players everywhere are still submitting picks for "{seasons.list.find((s) => s.id === seasons.activeSeasonId)?.name}".</p>
          )}
        </div>

        <div className="space-y-1 mb-4">
          {seasons.list.map((s) => (
            <div key={s.id} className="flex items-center justify-between text-xs mono-font px-2 py-1.5 rounded" style={{ background: "var(--surface)" }}>
              <span>{s.name} {s.id === seasons.activeSeasonId && <Pill tone="win">current</Pill>}</span>
              {seasons.list.length > 1 && (
                <button onClick={() => deleteSeason(s.id)} className="px-2 py-0.5 rounded" style={{ color: "var(--loss)" }}>
                  {confirmDeleteSeasonId === s.id ? "Click again to confirm" : "Delete"}
                </button>
              )}
            </div>
          ))}
        </div>

        <p className="text-xs uppercase tracking-wide mb-2" style={{ color: "var(--muted)" }}>Start a new season</p>
        <div className="flex gap-2 mb-2">
          <input value={newSeasonName} onChange={(e) => setNewSeasonName(e.target.value)} placeholder="new pool name, e.g. LMPE 2027" className="flex-1 px-2 py-1.5 rounded text-sm" style={inputStyle()} />
          <button onClick={startNewSeason} className="px-3 py-1.5 rounded text-sm display-font" style={{ background: "var(--gold)", color: "#12161C" }}>Start New Season</button>
        </div>
        {seasonMsg && <p className="text-[11px]" style={{ color: "var(--gold)" }}>{seasonMsg}</p>}
        <p className="text-[11px] mt-2" style={{ color: "var(--muted)" }}>Starting a new season gives everyone a completely fresh roster, weeks, and pot — it does not touch or delete "{seasons.list.find((s) => s.id === seasons.activeSeasonId)?.name}". Anyone can still view past seasons from the season selector at the top of the app; player passwords carry over automatically since they aren't tied to any one season. Deleting a season permanently erases its roster, weeks, picks, and pot — this can't be undone, which is why it takes two clicks.</p>
      </Section>

      <Section title="Account Security">
        <p className="text-xs uppercase tracking-wide mb-2" style={{ color: "var(--muted)" }}>Change admin password</p>
        <div className="grid grid-cols-2 gap-2 mb-2">
          <input type="password" value={newAdminPw} onChange={(e) => setNewAdminPw(e.target.value)} placeholder="new password" className="px-2 py-1.5 rounded text-sm" style={inputStyle()} />
          <input type="password" value={newAdminPwConfirm} onChange={(e) => setNewAdminPwConfirm(e.target.value)} placeholder="confirm new password" className="px-2 py-1.5 rounded text-sm" style={inputStyle()} />
        </div>
        <button onClick={changeAdminPassword} className="w-full py-2 rounded text-sm display-font mb-2" style={{ background: "var(--gold)", color: "#12161C" }}>Set New Admin Password</button>
        {adminPwMsg && <p className="text-[11px] mb-2" style={{ color: "var(--loss)" }}>{adminPwMsg}</p>}
        <p className="text-[11px]" style={{ color: "var(--muted)" }}>Changing the password also generates a brand new recovery code — share the new password with anyone who needs admin access.</p>

        {newRecoveryCode && (
          <div className="mt-3 p-3 rounded" style={{ background: "var(--bg)", border: "1px dashed var(--gold)" }}>
            <p className="text-xs mb-2" style={{ color: "var(--gold)" }}>New recovery code — save this now, it won't be shown again:</p>
            <div className="text-center py-2 mb-2 rounded mono-font text-lg" style={{ color: "var(--gold)", letterSpacing: "0.1em" }}>{newRecoveryCode}</div>
            <button
              onClick={async () => { try { await navigator.clipboard.writeText(newRecoveryCode); flash("Recovery code copied."); } catch { flash("Couldn't copy — select the code manually."); } }}
              className="w-full py-1.5 rounded text-xs display-font" style={{ background: "var(--surface)", border: "1px solid var(--hairline)", color: "var(--text)" }}
            >
              Copy to clipboard
            </button>
            <button onClick={() => setNewRecoveryCode("")} className="w-full py-1.5 mt-1 rounded text-xs" style={{ color: "var(--muted)" }}>Done, dismiss</button>
          </div>
        )}
      </Section>

      <Section title="Testing">
        <div className="flex gap-2 flex-wrap">
          <button onClick={seedTestData} className="px-3 py-1.5 rounded text-sm display-font" style={{ background: "var(--gold)", color: "#12161C" }}>Seed Test Week</button>
          <button onClick={clearAllData} className="px-3 py-1.5 rounded text-sm display-font" style={{ background: "var(--surface)", border: "1px solid var(--loss)", color: "var(--loss)" }}>
            {confirmClearAll ? `Click again to clear all "${seasonName}" season data` : "Clear All Data"}
          </button>
          {confirmClearAll && <button onClick={() => setConfirmClearAll(false)} className="px-3 py-1.5 rounded text-sm display-font" style={{ background: "var(--surface)", color: "var(--muted)" }}>Cancel</button>}
        </div>
        <p className="text-[11px] mt-2" style={{ color: "var(--muted)" }}>Seeds week 1 with 3 games (one already finished 27–20), alice + carol with full pick sets, bob with only 3 picks so you can watch the missing-pick rule score as losses. The week deadline is set 3 minutes out so you can watch it lock live.</p>
        <p className="text-[11px] mt-1" style={{ color: "var(--muted)" }}>Clear All Data wipes the roster, weeks, picks, and pot for whichever season you're currently viewing/editing ("{seasonName}") — it doesn't distinguish test data from real data, so double-check the season selector above before confirming.</p>
      </Section>

      <Section title="Roster">
        <div className="flex gap-2 mb-3">
          <input value={newUser} onChange={(e) => setNewUser(e.target.value)} placeholder="add username" className="flex-1 px-2 py-1.5 rounded text-sm" style={inputStyle()} />
          <button onClick={() => { if (!newUser.trim() || roster.usernames.includes(newUser.trim())) return; onRosterChange({ ...roster, usernames: [...roster.usernames, newUser.trim()] }); setNewUser(""); }} className="px-3 py-1.5 rounded text-sm display-font" style={{ background: "var(--gold)", color: "#12161C" }}>Add</button>
        </div>
        <div className="flex flex-wrap gap-2 mb-3">
          {roster.usernames.map((u) => (
            <span key={u} className="px-2 py-1 rounded text-xs mono-font flex items-center gap-1" style={{ background: "var(--surface)" }}>
              {roster.teamNames?.[u] || u}
              <button onClick={() => onRosterChange({ ...roster, usernames: roster.usernames.filter((x) => x !== u) })} style={{ color: "var(--loss)" }}>×</button>
            </span>
          ))}
        </div>
        <div className="flex items-center gap-3 flex-wrap">
          <label className="flex items-center gap-2 text-sm">
            <input type="checkbox" checked={roster.locked} onChange={(e) => onRosterChange({ ...roster, locked: e.target.checked })} />
            Roster locked (new usernames can't join)
          </label>
          <button onClick={lockRosterAndPin} className="px-2 py-1 rounded text-xs display-font" style={{ background: "var(--surface)", color: "var(--gold)" }}>Lock &amp; pin pot count ({roster.usernames.length})</button>
        </div>
        {roster.pinnedCount != null && <p className="text-[11px] mt-1" style={{ color: "var(--muted)" }}>Pot is fixed at ${ENTRY_FEE} × {roster.pinnedCount} players/week.</p>}
      </Section>

      <Section title="Player Passwords">
        <div className="space-y-1 mb-4">
          {roster.usernames.length === 0 && <p className="text-xs" style={{ color: "var(--muted)" }}>No players on the roster yet.</p>}
          {roster.usernames.map((u) => (
            <div key={u} className="flex items-center justify-between text-xs mono-font px-2 py-1.5 rounded" style={{ background: "var(--surface)" }}>
              <span>{u} <Pill tone={passwords?.[u] ? "win" : "muted"}>{passwords?.[u] ? "protected" : "no password"}</Pill></span>
              {passwords?.[u] && <button onClick={() => resetPassword(u)} className="px-2 py-0.5 rounded" style={{ color: "var(--loss)" }}>Reset</button>}
            </div>
          ))}
        </div>
        <p className="text-xs uppercase tracking-wide mb-2" style={{ color: "var(--muted)" }}>Assign a password directly (e.g. a temporary one after a reset)</p>
        <div className="grid grid-cols-2 gap-2 mb-2">
          <select value={pwFormUser} onChange={(e) => setPwFormUser(e.target.value)} className="px-2 py-1.5 rounded text-sm" style={inputStyle()}>
            <option value="">Select player…</option>
            {roster.usernames.map((u) => <option key={u} value={u}>{u}</option>)}
          </select>
          <input type="password" placeholder="new password" value={pwFormValue} onChange={(e) => setPwFormValue(e.target.value)} className="px-2 py-1.5 rounded text-sm" style={inputStyle()} />
        </div>
        <button onClick={setPasswordDirect} className="w-full py-2 rounded text-sm display-font" style={{ background: "var(--gold)", color: "#12161C" }}>Set Password</button>
        {pwFormMsg && <p className="text-[11px] mt-2" style={{ color: "var(--gold)" }}>{pwFormMsg}</p>}
        <p className="text-[11px] mt-2" style={{ color: "var(--muted)" }}>Passwords are hashed (SHA-256) before being stored — not plain text — but this is still a casual-league safeguard, not bank-grade security. They're global, shared across every season, not tied to this one.</p>
      </Section>

      <Section title="Current Week">
        <div className="p-3 rounded-lg mb-3" style={{ background: "rgba(212,175,55,0.15)", border: "2px solid var(--gold)" }}>
          <p className="text-[10px] uppercase tracking-widest mb-1" style={{ color: "var(--gold)" }}>You are editing</p>
          <div className="flex items-center gap-3 flex-wrap">
            <select
              value={meta.currentWeek}
              onChange={(e) => onSetCurrentWeek(Number(e.target.value))}
              className="px-3 py-2 rounded display-font text-xl font-bold"
              style={{ background: "var(--bg)", border: "2px solid var(--gold)", color: "var(--gold)" }}
            >
              {[...new Set([...weekNums, meta.currentWeek])].sort((a, b) => a - b).map((wn) => <option key={wn} value={wn}>Week {wn}</option>)}
            </select>
            <button
              disabled={Math.max(...weekNums, 0) >= MAX_WEEKS}
              onClick={() => onSetCurrentWeek(Math.min(MAX_WEEKS, Math.max(...weekNums, meta.currentWeek) + 1))}
              className="px-3 py-2 rounded text-sm display-font" style={{ background: "var(--surface)", color: "var(--text)" }}
            >
              + New Week
            </button>
            <span className="text-sm" style={{ color: "var(--muted)" }}>of {seasonName} — every action below (games, results, imports, exports) applies to this week</span>
          </div>
        </div>
        <div className="flex items-center gap-2 mb-3 flex-wrap">
          <button onClick={exportWeekXlsx} className="px-3 py-1.5 rounded text-sm display-font" style={{ background: "var(--surface)", color: "var(--gold)" }}>Export Current Week</button>
          <button onClick={exportSeasonXlsx} className="px-3 py-1.5 rounded text-sm display-font" style={{ background: "var(--surface)", color: "var(--gold)" }}>Export Season</button>
        </div>

        {exportPreview && (
          <div className="mt-3 p-3 rounded" style={{ background: "var(--surface)", border: "1px solid var(--hairline)" }}>
            <div className="flex items-center justify-between mb-2">
              <span className="text-xs mono-font" style={{ color: "var(--muted)" }}>{exportPreview.filename}</span>
              <div className="flex gap-2">
                {exportPreview.csv != null && (
                  <button
                    onClick={async () => {
                      try { await navigator.clipboard.writeText(exportPreview.csv); flash("Copied to clipboard."); }
                      catch { flash("Clipboard blocked too — select the text below and copy manually."); }
                    }}
                    className="px-2 py-1 rounded text-xs display-font" style={{ background: "var(--gold)", color: "#12161C" }}
                  >
                    Copy to clipboard
                  </button>
                )}
                <button onClick={() => setExportPreview(null)} className="px-2 py-1 rounded text-xs" style={{ color: "var(--muted)" }}>×</button>
              </div>
            </div>
            {exportPreview.csv != null ? (
              <>
                <textarea readOnly value={exportPreview.csv} rows={6} onClick={(e) => e.target.select()} className="w-full px-2 py-1.5 rounded text-xs mono-font" style={inputStyle()} />
                <p className="text-[11px] mt-1" style={{ color: "var(--muted)" }}>If the download button didn't drop a file, paste this into a spreadsheet, or save it as a .csv file yourself.</p>
              </>
            ) : (
              <p className="text-[11px]" style={{ color: "var(--muted)" }}>{exportPreview.note}</p>
            )}
          </div>
        )}

        <div className="mb-3">
          <label className="block text-xs uppercase tracking-wide mb-1" style={{ color: "var(--muted)" }}>Pick deadline (Sun 10a MT rule)</label>
          <div className="flex gap-2 flex-wrap">
            <input type="datetime-local" value={toLocalDatetimeValue(editWeek.deadline)} onChange={(e) => saveWeek({ deadline: new Date(e.target.value).toISOString() })} className="px-2 py-1.5 rounded text-sm" style={inputStyle()} />
            <button onClick={() => saveWeek({ deadline: nextSundayMT10ISO() })} className="px-3 py-1.5 rounded text-xs display-font" style={{ background: "var(--surface)", border: "1px solid var(--gold)", color: "var(--gold)" }}>set next Sun 10a MT</button>
          </div>
          <p className="text-[11px] mt-1" style={{ color: "var(--muted)" }}>This fills in automatically to Sun 10am MT of that week the moment you add or import games — you only need to touch this if you want to override it.</p>
        </div>
        <label className="flex items-center gap-2 text-sm mb-4">
          <input type="checkbox" checked={!!editWeek.locked} onChange={(e) => saveWeek({ locked: e.target.checked })} />
          Force-lock this week now (overrides deadline)
        </label>

        <div className="mb-4 p-3 rounded" style={{ background: "var(--surface)" }}>
          <p className="text-xs uppercase tracking-wide mb-2" style={{ color: "var(--muted)" }}>the-odds-api.com integration</p>

          <div className="mb-3 p-2 rounded" style={{ background: "rgba(212,175,55,0.12)", border: "1px solid var(--gold)" }}>
            <label className="flex items-center gap-2 text-sm" style={{ color: "var(--gold)" }}>
              <input type="checkbox" checked={importConfirmed} onChange={(e) => setImportConfirmed(e.target.checked)} />
              I confirm I want to import odds/scores into <strong>Week {meta.currentWeek}</strong>
            </label>
          </div>

          <input type="password" value={oddsApiKey} onChange={(e) => setOddsApiKey(e.target.value)} placeholder="your the-odds-api.com API key" className="w-full px-2 py-1.5 rounded text-sm mb-2" style={inputStyle()} />
          <p className="text-[11px] uppercase tracking-wide mb-1" style={{ color: "var(--muted)" }}>Only import games between (required)</p>
          <div className="grid grid-cols-2 gap-2 mb-1">
            <input type="datetime-local" value={importFrom} onChange={(e) => setImportFrom(e.target.value)} className="px-2 py-1.5 rounded text-sm" style={inputStyle()} />
            <input type="datetime-local" value={importTo} onChange={(e) => setImportTo(e.target.value)} className="px-2 py-1.5 rounded text-sm" style={inputStyle()} />
          </div>
          <div className="grid grid-cols-2 gap-2 mb-2">
            <p className="text-[11px] mono-font" style={{ color: "var(--gold)" }}>{importFrom ? fmtMilitary(importFrom) : ""}</p>
            <p className="text-[11px] mono-font" style={{ color: "var(--gold)" }}>{importTo ? fmtMilitary(importTo) : ""}</p>
          </div>
          <div className="flex gap-2 mb-2 flex-wrap">
            <button disabled={!importConfirmed || !importFrom || !importTo} onClick={fetchOddsLive} className="px-3 py-1.5 rounded text-xs display-font" style={importConfirmed && importFrom && importTo ? { background: "var(--gold)", color: "#12161C" } : { background: "var(--surface)", border: "1px solid var(--hairline)", color: "var(--muted)" }}>Pull odds (spreads/totals)</button>
            <button disabled={!importConfirmed} onClick={fetchScoresLive} className="px-3 py-1.5 rounded text-xs display-font" style={importConfirmed ? { background: "var(--gold)", color: "#12161C" } : { background: "var(--surface)", border: "1px solid var(--hairline)", color: "var(--muted)" }}>Pull final scores</button>
          </div>
          <p className="text-[11px] mb-2" style={{ color: "var(--muted)" }}>If a live pull fails (sandboxed browsers sometimes block cross-site requests), fetch the URL yourself and paste the JSON response here:</p>
          <textarea value={pastePayload} onChange={(e) => setPastePayload(e.target.value)} placeholder="paste API JSON response" rows={3} className="w-full px-2 py-1.5 rounded text-xs mono-font mb-2" style={inputStyle()} />
          <div className="flex gap-2">
            <button disabled={!importConfirmed || !importFrom || !importTo} onClick={importPastedOdds} className="px-3 py-1.5 rounded text-xs display-font" style={importConfirmed && importFrom && importTo ? { background: "var(--surface)", border: "1px solid var(--hairline)", color: "var(--text)" } : { background: "var(--surface)", border: "1px solid var(--hairline)", color: "var(--muted)", opacity: 0.5 }}>Import pasted odds</button>
            <button disabled={!importConfirmed} onClick={importPastedScores} className="px-3 py-1.5 rounded text-xs display-font" style={importConfirmed ? { background: "var(--surface)", border: "1px solid var(--hairline)", color: "var(--text)" } : { background: "var(--surface)", border: "1px solid var(--hairline)", color: "var(--muted)", opacity: 0.5 }}>Import pasted scores</button>
          </div>
          {!importConfirmed && <p className="text-[11px] mt-2" style={{ color: "var(--loss)" }}>Check the box above to enable importing.</p>}
          {importConfirmed && (!importFrom || !importTo) && <p className="text-[11px] mt-2" style={{ color: "var(--loss)" }}>Set both dates above to enable odds import — final scores don't need a date range since they're matched to games already in this week.</p>}
          {fetchMsg && <p className="text-xs mt-2" style={{ color: "var(--gold)" }}>{fetchMsg}</p>}
        </div>

        <div className="mb-3 grid grid-cols-2 gap-2">
          <input placeholder="Team A (away)" value={gameForm.teamA} onChange={(e) => setGameForm({ ...gameForm, teamA: e.target.value })} className="px-2 py-1.5 rounded text-sm" style={inputStyle()} />
          <input placeholder="Team B (home)" value={gameForm.teamB} onChange={(e) => setGameForm({ ...gameForm, teamB: e.target.value })} className="px-2 py-1.5 rounded text-sm" style={inputStyle()} />
          <input placeholder="Team A spread e.g. -3.5" value={gameForm.spreadA} onChange={(e) => setGameForm({ ...gameForm, spreadA: e.target.value })} className="px-2 py-1.5 rounded text-sm" style={inputStyle()} />
          <input placeholder="Total e.g. 44.5" value={gameForm.total} onChange={(e) => setGameForm({ ...gameForm, total: e.target.value })} className="px-2 py-1.5 rounded text-sm" style={inputStyle()} />
          <input type="datetime-local" value={gameForm.kickoff} onChange={(e) => setGameForm({ ...gameForm, kickoff: e.target.value })} className="px-2 py-1.5 rounded text-sm col-span-2" style={inputStyle()} />
        </div>
        <button onClick={addGame} className="w-full py-2 rounded text-sm display-font mb-4" style={{ background: "var(--gold)", color: "#12161C" }}>Add Game Manually</button>

        {(editWeek.games || []).length > 0 && (
          <div className="flex gap-2 mb-3">
            <button onClick={clearAllGames} className="flex-1 py-1.5 rounded text-xs display-font" style={{ background: "var(--surface)", border: "1px solid var(--loss)", color: "var(--loss)" }}>
              {confirmClearGames ? `Click again to clear all ${(editWeek.games || []).length} games` : "Clear All Games for This Week"}
            </button>
            {confirmClearGames && <button onClick={() => setConfirmClearGames(false)} className="px-3 py-1.5 rounded text-xs display-font" style={{ background: "var(--surface)", color: "var(--muted)" }}>Cancel</button>}
          </div>
        )}

        <div className="space-y-3">
          {sortByKickoff(editWeek.games || []).map((g) => {
            const result = computeGameResult(g);
            return (
              <TicketCard key={g.id}>
                <div className="flex items-center justify-between mb-2">
                  <span className="font-medium text-sm">{g.label}</span>
                  <button onClick={() => removeGame(g.id)} className="text-xs" style={{ color: "var(--loss)" }}>remove</button>
                </div>
                <div className="text-xs mono-font mb-2" style={{ color: "var(--muted)" }}>
                  {g.teamA} {fmtSpread(g.spreadA)} &middot; {g.teamB} {fmtSpread(-Number(g.spreadA || 0))} &middot; O/U {g.total} {g.kickoff && <>&middot; kickoff {fmtKickoff(g.kickoff)}</>} {isGameLocked(g) && <Pill tone="loss">started</Pill>}
                </div>
                <div className="grid grid-cols-2 gap-2 mb-2">
                  <input placeholder={`${g.teamA} final`} value={g.finalScoreA ?? ""} onChange={(e) => updateGame(g.id, { finalScoreA: e.target.value === "" ? null : Number(e.target.value) })} className="px-2 py-1.5 rounded text-xs" style={inputStyle()} />
                  <input placeholder={`${g.teamB} final`} value={g.finalScoreB ?? ""} onChange={(e) => updateGame(g.id, { finalScoreB: e.target.value === "" ? null : Number(e.target.value) })} className="px-2 py-1.5 rounded text-xs" style={inputStyle()} />
                </div>
                {result && (
                  <div className="text-xs mono-font">
                    Cover: <span style={{ color: "var(--gold)" }}>{result.spreadWinner === "push" ? "push" : result.spreadWinner === "teamA" ? g.teamA : g.teamB}</span> &middot; Total: <span style={{ color: "var(--gold)" }}>{result.totalResult}</span>
                  </div>
                )}
              </TicketCard>
            );
          })}
        </div>
      </Section>

      <Section title="Correct Monies Owed">
        <div className="grid grid-cols-2 gap-2 mb-2">
          <select value={adjForm.username} onChange={(e) => setAdjForm({ ...adjForm, username: e.target.value })} className="px-2 py-1.5 rounded text-sm" style={inputStyle()}>
            <option value="">Select player…</option>
            {roster.usernames.map((u) => <option key={u} value={u}>{roster.teamNames?.[u] || u}</option>)}
          </select>
          <select value={adjForm.field} onChange={(e) => setAdjForm({ ...adjForm, field: e.target.value })} className="px-2 py-1.5 rounded text-sm" style={inputStyle()}>
            <option value="paid">Adjust amount paid</option>
            <option value="won">Adjust amount won</option>
          </select>
          <input placeholder="amount (use negative to subtract)" value={adjForm.amount} onChange={(e) => setAdjForm({ ...adjForm, amount: e.target.value })} className="px-2 py-1.5 rounded text-sm col-span-2" style={inputStyle()} />
          <input placeholder="note (optional)" value={adjForm.note} onChange={(e) => setAdjForm({ ...adjForm, note: e.target.value })} className="px-2 py-1.5 rounded text-sm col-span-2" style={inputStyle()} />
        </div>
        <button onClick={addAdjustment} className="w-full py-2 rounded text-sm display-font mb-3" style={{ background: "var(--gold)", color: "#12161C" }}>Add Adjustment</button>
        <div className="space-y-1">
          {(ledger.adjustments || []).map((a) => (
            <div key={a.id} className="flex items-center justify-between text-xs mono-font px-2 py-1.5 rounded" style={{ background: "var(--surface)" }}>
              <span>{roster.teamNames?.[a.username] || a.username}: {a.field} {a.amount >= 0 ? "+" : ""}{a.amount} {a.note && `(${a.note})`}</span>
              <button onClick={() => removeAdjustment(a.id)} style={{ color: "var(--loss)" }}>×</button>
            </div>
          ))}
        </div>
      </Section>
    </div>
  );
}


  /* ================= END APP CODE ================= */

  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(<PickemLeague />);
</script>
</body>
</html>
