  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // Firebase Realtime Database keys can't contain ".", "#", "$", "[", "]", "/"
  // Our storage keys use ":" freely, which IS allowed, but let's be safe and
  // escape anything else just in case.
  function safeDbKey(key) {
    return key.replace(/[.#$\[\]\/]/g, "_");
  }

  // This reimplements the exact same get/set/delete/list interface the app
  // already expects (originally backed by Claude's window.storage) — so the
  // rest of the app's code needs ZERO changes. "shared" data goes to
  // Firebase (genuinely shared across every visitor); "personal" data goes
  // to this browser's own localStorage (exactly matching the original
  // per-browser behavior for things like your remembered username).
  window.storage = {
    async get(key, shared) {
      if (!shared) {
        const v = localStorage.getItem("personal:" + key);
        if (v === null) throw new Error("not found");
        return { key, value: v, shared };
      }
      const snap = await db.ref("shared/" + safeDbKey(key)).get();
      if (!snap.exists()) throw new Error("not found");
      return { key, value: snap.val(), shared };
    },
    async set(key, value, shared) {
      if (!shared) {
        localStorage.setItem("personal:" + key, value);
        return { key, value, shared };
      }
      await db.ref("shared/" + safeDbKey(key)).set(value);
      return { key, value, shared };
    },
    async delete(key, shared) {
      if (!shared) {
        localStorage.removeItem("personal:" + key);
        return { key, deleted: true, shared };
      }
      await db.ref("shared/" + safeDbKey(key)).remove();
      return { key, deleted: true, shared };
    },
    async list(prefix, shared) {
      if (!shared) {
        const keys = Object.keys(localStorage)
          .filter((k) => k.startsWith("personal:" + (prefix || "")))
          .map((k) => k.slice("personal:".length));
        return { keys, prefix, shared };
      }
      const snap = await db.ref("shared").get();
      const all = snap.exists() ? Object.keys(snap.val()) : [];
      return { keys: all, prefix, shared };
    },
  };
</script>

<script type="text/babel" data-presets="react">
  const { useState, useEffect, useMemo } = React;

/* ------------------------------------------------------------------ *
 *  LMPE — multi-season ATS/O-U pick 'em league
 *  seasons:   { list: [{id, name, createdAt}], activeSeasonId }  (shared, global)
 *  passwords: { [username]: sha256Hex }  (shared, global — spans all seasons)
 *  admin-pass: shared string, global (simple shared gate, not real security)
 *  my-identity / my-team: personal (shared:false), global
 *
 *  Per-season (season-1 uses the original un-prefixed keys so existing
 *  data isn't lost; every later season gets its own prefixed set):
 *  meta:    { currentWeek }
 *  roster:  { usernames: string[], teamNames: {username: teamName}, locked, pinnedCount }
 *  weeks:   { [weekNum]: { games: [Game], deadline (ISO), locked } }
 *  picks:   { [weekNum]: { [username]: Pick[] } }
 *  ledger:  { adjustments: [{id, username, field:'paid'|'won', amount, note}] }
 * ------------------------------------------------------------------ */

const DEFAULT_SEASON_NAME = "LMPE 2026";
const KEYS = {
  seasons: "pickem:seasons",
  passwords: "pickem:passwords",
  adminPass: "pickem:admin-pass",
  adminRecovery: "pickem:admin-recovery",
};
function seasonKeys(seasonId) {
  const prefix = seasonId === "season-1" ? "pickem:" : `pickem:${seasonId}:`;
  return {
    meta: `${prefix}meta`,
    roster: `${prefix}roster`,
    weeks: `${prefix}weeks`,
    picks: `${prefix}picks`,
    ledger: `${prefix}ledger`,
    comments: `${prefix}comments`,
  };
}
const PICKS_PER_WEEK = 5;
const ENTRY_FEE = 5;
const MAX_WEEKS = 19;

async function loadJSON(key, fallback, shared = true) {
  try {
    const r = await window.storage.get(key, shared);
    return r ? JSON.parse(r.value) : fallback;
  } catch {
    return fallback;
  }
}
async function saveJSON(key, value, shared = true) {
  await window.storage.set(key, JSON.stringify(value), shared);
}
function newId() {
  return Math.random().toString(36).slice(2, 9);
}
async function sha256Hex(text) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
}
/** e.g. "K7QX-9F2M-P4RT" — random, unambiguous (no 0/O/1/I), easy to read and retype. */
function generateRecoveryCode() {
  const chars = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
  const bytes = crypto.getRandomValues(new Uint8Array(12));
  const raw = Array.from(bytes).map((b) => chars[b % chars.length]).join("");
  return `${raw.slice(0, 4)}-${raw.slice(4, 8)}-${raw.slice(8, 12)}`;
}

/** Convert a wall-clock time in America/Denver to a correct UTC Date, DST-safe. */
function denverWallTimeToUTC(y, m, d, h, min) {
  const guess = new Date(Date.UTC(y, m, d, h, min));
  const asDenver = new Date(guess.toLocaleString("en-US", { timeZone: "America/Denver" }));
  const asUTC = new Date(guess.toLocaleString("en-US", { timeZone: "UTC" }));
  const diff = asUTC.getTime() - asDenver.getTime();
  return new Date(guess.getTime() + diff);
}
function nextSundayMT10ISO() {
  return sundayMT10ISOFor(new Date().toISOString());
}
/** Sunday 10am MT of the week containing referenceISO (0 days added if referenceISO is already Sunday). */
function sundayMT10ISOFor(referenceISO) {
  const ref = new Date(referenceISO);
  const denverParts = new Intl.DateTimeFormat("en-US", { timeZone: "America/Denver", year: "numeric", month: "2-digit", day: "2-digit", weekday: "short" }).formatToParts(ref);
  const y = +denverParts.find((p) => p.type === "year").value;
  const mo = +denverParts.find((p) => p.type === "month").value - 1;
  const d = +denverParts.find((p) => p.type === "day").value;
  const weekdayMap = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 };
  const wd = weekdayMap[denverParts.find((p) => p.type === "weekday").value];
  const add = (7 - wd) % 7; // 0 if referenceISO is already a Sunday
  const target = denverWallTimeToUTC(y, mo, d + add, 10, 0);
  return target.toISOString();
}

function isWeekLocked(week) {
  if (!week) return false;
  if (week.locked) return true;
  if (week.deadline && Date.now() > new Date(week.deadline).getTime()) return true;
  return false;
}
function isWeekRevealed(week) {
  return isWeekLocked(week);
}
/** A single pick is visible to other players as soon as its game starts, or the whole week once the deadline passes. */
function isPickRevealed(game, week) {
  if (game && isGameLocked(game)) return true;
  return isWeekLocked(week);
}
function isGameLocked(game) {
  return !!(game.kickoff && Date.now() > new Date(game.kickoff).getTime());
}

/** Derive spread/total outcome from a game's numeric lines + final scores. Returns null if no score yet. */
function computeGameResult(game) {
  if (game.finalScoreA == null || game.finalScoreB == null) return null;
  const a = Number(game.finalScoreA), b = Number(game.finalScoreB);
  const spreadA = Number(game.spreadA || 0);
  const adjA = a + spreadA;
  let spreadWinner;
  if (adjA > b) spreadWinner = "teamA";
  else if (adjA < b) spreadWinner = "teamB";
  else spreadWinner = "push";
  const sum = a + b;
  const total = Number(game.total || 0);
  let totalResult;
  if (sum > total) totalResult = "over";
  else if (sum < total) totalResult = "under";
  else totalResult = "push";
  return { spreadWinner, totalResult };
}

/** 'win' | 'loss' | 'pending' */
function scorePick(pick, game) {
  const res = computeGameResult(game);
  if (!res) return "pending";
  if (pick.type === "spread") {
    return res.spreadWinner === "push" ? "loss" : pick.selection === res.spreadWinner ? "win" : "loss";
  } else {
    return res.totalResult === "push" ? "loss" : pick.selection === res.totalResult ? "win" : "loss";
  }
}

const BET_OPTIONS = (game) => ({
  spread: [
    { value: "teamA", label: `${game.teamA} ${fmtSpread(game.spreadA)}` },
    { value: "teamB", label: `${game.teamB} ${fmtSpread(-Number(game.spreadA || 0))}` },
  ],
  total: [
    { value: "over", label: `Over ${game.total ?? ""}` },
    { value: "under", label: `Under ${game.total ?? ""}` },
  ],
});
function fmtSpread(n) {
  const v = Number(n || 0);
  return v > 0 ? `+${v}` : `${v}`;
}
function fmtKickoff(iso) {
  if (!iso) return "time TBD";
  return new Date(iso).toLocaleString(undefined, { weekday: "short", month: "numeric", day: "numeric", hour: "numeric", minute: "2-digit" });
}
/** Always shows the time in Mountain Time explicitly, regardless of the viewer's own timezone — used for the pick deadline. */
function fmtMountainTime(iso) {
  if (!iso) return "TBD";
  return new Date(iso).toLocaleString("en-US", { timeZone: "America/Denver", weekday: "short", month: "numeric", day: "numeric", hour: "numeric", minute: "2-digit" }) + " MT";
}
/** Converts a stored UTC ISO string into the "YYYY-MM-DDTHH:MM" the browser's local time expects
 * for a <input type="datetime-local"> value. toISOString() alone would show raw UTC digits
 * mislabeled as local time, which is exactly the "shows 4pm instead of 10am" bug this fixes. */
function toLocalDatetimeValue(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  const off = d.getTimezoneOffset() * 60000;
  return new Date(d.getTime() - off).toISOString().slice(0, 16);
}
/** Day-of-week + 24-hour time, used only to confirm the admin's import date-range boundaries unambiguously. */
function fmtMilitary(localDatetimeValue) {
  if (!localDatetimeValue) return "";
  const d = new Date(localDatetimeValue);
  return d.toLocaleString(undefined, { weekday: "short", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false });
}
function sortByKickoff(games) {
  return [...games].sort((a, b) => {
    if (!a.kickoff && !b.kickoff) return 0;
    if (!a.kickoff) return 1;
    if (!b.kickoff) return -1;
    return new Date(a.kickoff) - new Date(b.kickoff);
  });
}
/** Sunday 10am MT of the week containing the earliest scheduled game, or null if no games have a kickoff yet. */
function deadlineFromGames(games) {
  const withKickoff = games.filter((g) => g.kickoff);
  if (withKickoff.length === 0) return null;
  const earliest = sortByKickoff(withKickoff)[0];
  return sundayMT10ISOFor(earliest.kickoff);
}

/** Standings across all locked/scored weeks, including ledger adjustments. */
function computeStandings(roster, weeksData, picksData, ledger) {
  const usernames = roster.usernames || [];
  const stats = {};
  usernames.forEach((u) => (stats[u] = { username: u, teamName: roster.teamNames?.[u] || u, wins: 0, losses: 0, weeksPlayed: 0, totalPaid: 0, totalWon: 0, perfectWeeks: 0, wonWeeks: [], oferOwed: 0, oferWeeks: [] }));

  const potBase = roster.pinnedCount ?? usernames.length;
  const weekNums = Object.keys(weeksData || {}).map(Number).sort((a, b) => a - b);
  let carryPot = 0;
  let oferPotTotal = 0;
  const weeklyLeagueStats = {};

  weekNums.forEach((wn) => {
    const week = weeksData[wn];
    if (!week) return;
    const hasResults = week.games?.length > 0 && week.games.every((g) => computeGameResult(g) !== null);
    if (!hasResults) return;

    const winnersThisWeek = [];
    const winsByUser = {};
    let leagueCorrect = 0, leagueTotal = 0;
    usernames.forEach((u) => {
      stats[u].totalPaid += ENTRY_FEE;
      stats[u].weeksPlayed += 1;
      const userPicks = (picksData[wn] && picksData[wn][u]) || [];
      let wCount = 0, lCount = 0;
      userPicks.slice(0, PICKS_PER_WEEK).forEach((p) => {
        const game = week.games.find((g) => g.id === p.gameId);
        if (!game) return;
        const outcome = scorePick(p, game);
        if (outcome === "win") wCount++;
        else if (outcome === "loss") lCount++;
      });
      const missing = Math.max(0, PICKS_PER_WEEK - userPicks.length);
      lCount += missing;
      stats[u].wins += wCount;
      stats[u].losses += lCount;
      winsByUser[u] = wCount;
      leagueCorrect += wCount;
      leagueTotal += wCount + lCount;
      if (hasResults && missing === 0 && wCount === PICKS_PER_WEEK) {
        stats[u].perfectWeeks += 1;
        winnersThisWeek.push(u);
      }
    });
    weeklyLeagueStats[wn] = { correct: leagueCorrect, total: leagueTotal, pct: leagueTotal ? (leagueCorrect / leagueTotal) * 100 : 0 };

    if (hasResults) {
      usernames.forEach((u) => {
        if (winsByUser[u] === 0) {
          stats[u].oferOwed += ENTRY_FEE;
          stats[u].oferWeeks.push(wn);
          oferPotTotal += ENTRY_FEE;
        }
      });
      const potThisWeek = ENTRY_FEE * potBase + carryPot;
      if (winnersThisWeek.length > 0) {
        const share = potThisWeek / winnersThisWeek.length;
        winnersThisWeek.forEach((u) => { stats[u].totalWon += share; stats[u].wonWeeks.push(wn); });
        carryPot = 0;
      } else {
        carryPot = potThisWeek;
      }
    }
  });

  (ledger?.adjustments || []).forEach((adj) => {
    if (!stats[adj.username]) return;
    if (adj.field === "paid") stats[adj.username].totalPaid += Number(adj.amount);
    else stats[adj.username].totalWon += Number(adj.amount);
  });

  return { rows: usernames.map((u) => stats[u]), carryPot, oferPotTotal, weeklyLeagueStats };
}

function buildCSV(headers, rows) {
  const esc = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  return [headers.map(esc).join(","), ...rows.map((r) => r.map(esc).join(","))].join("\n");
}
function tryDownloadBlob(filename, blob) {
  try {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    return true;
  } catch {
    return false;
  }
}
function tryDownloadCSV(filename, csv) {
  return tryDownloadBlob(filename, new Blob([csv], { type: "text/csv" }));
}

/* ---- Minimal from-scratch XLSX writer (raw ZIP, no libraries) ----
 * The bundled SheetJS build can't write cell styles (fills/colors) —
 * that's a paid-tier feature — so real win/loss coloring means
 * building the .xlsx package by hand: it's just a ZIP of XML files. */
function crc32(buf) {
  if (!crc32.table) {
    const t = [];
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
      t[n] = c >>> 0;
    }
    crc32.table = t;
  }
  let crc = 0xffffffff;
  for (let i = 0; i < buf.length; i++) crc = (crc >>> 8) ^ crc32.table[(crc ^ buf[i]) & 0xff];
  return (crc ^ 0xffffffff) >>> 0;
}
function concatBytes(arrs) {
  const total = arrs.reduce((a, b) => a + b.length, 0);
  const out = new Uint8Array(total);
  let o = 0;
  arrs.forEach((a) => { out.set(a, o); o += a.length; });
  return out;
}
function buildZip(files) {
  const enc = new TextEncoder();
  let offset = 0;
  const localParts = [];
  const records = [];
  files.forEach((f) => {
    const nameBytes = enc.encode(f.name);
    const data = f.data;
    const crc = crc32(data);
    const dv = new DataView(new ArrayBuffer(30));
    dv.setUint32(0, 0x04034b50, true);
    dv.setUint16(4, 20, true);
    dv.setUint16(6, 0, true);
    dv.setUint16(8, 0, true); // store, no compression
    dv.setUint16(10, 0, true);
    dv.setUint16(12, 0x21, true);
    dv.setUint32(14, crc, true);
    dv.setUint32(18, data.length, true);
    dv.setUint32(22, data.length, true);
    dv.setUint16(26, nameBytes.length, true);
    dv.setUint16(28, 0, true);
    const entry = concatBytes([new Uint8Array(dv.buffer), nameBytes, data]);
    records.push({ nameBytes, crc, size: data.length, offset });
    offset += entry.length;
    localParts.push(entry);
  });
  const centralParts = records.map((r) => {
    const dv = new DataView(new ArrayBuffer(46));
    dv.setUint32(0, 0x02014b50, true);
    dv.setUint16(4, 20, true);
    dv.setUint16(6, 20, true);
    dv.setUint16(8, 0, true);
    dv.setUint16(10, 0, true);
    dv.setUint16(12, 0, true);
    dv.setUint16(14, 0x21, true);
    dv.setUint32(16, r.crc, true);
    dv.setUint32(20, r.size, true);
    dv.setUint32(24, r.size, true);
    dv.setUint16(28, r.nameBytes.length, true);
    dv.setUint16(30, 0, true);
    dv.setUint16(32, 0, true);
    dv.setUint16(34, 0, true);
    dv.setUint16(36, 0, true);
    dv.setUint32(38, 0, true);
    dv.setUint32(42, r.offset, true);
    return concatBytes([new Uint8Array(dv.buffer), r.nameBytes]);
  });
  const centralDirSize = centralParts.reduce((a, p) => a + p.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true);
  end.setUint16(8, records.length, true);
  end.setUint16(10, records.length, true);
  end.setUint32(12, centralDirSize, true);
  end.setUint32(16, offset, true);
  return concatBytes([...localParts, ...centralParts, new Uint8Array(end.buffer)]);
}
function colLetter(i) {
  let s = "";
  i += 1;
  while (i > 0) {
    const r = (i - 1) % 26;
    s = String.fromCharCode(65 + r) + s;
    i = Math.floor((i - 1) / 26);
  }
  return s;
}
function xmlEscape(v) {
  return String(v ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
/** styleForCell(rowIdx, colIdx, value, isHeader) -> 0 default, 1 bold header, 2 green, 3 red */
function buildXlsxBytes(headers, rows, styleForCell) {
  const enc = new TextEncoder();
  const allRows = [headers, ...rows];
  let sheetRows = "";
  allRows.forEach((row, r) => {
    const isHeader = r === 0;
    let cells = "";
    row.forEach((val, c) => {
      const s = isHeader ? 1 : styleForCell(r - 1, c, val);
      const ref = `${colLetter(c)}${r + 1}`;
      if (val === "" || val == null) {
        cells += `<c r="${ref}" s="${s}"/>`;
      } else if (typeof val === "number" && Number.isFinite(val)) {
        cells += `<c r="${ref}" s="${s}"><v>${val}</v></c>`;
      } else {
        cells += `<c r="${ref}" s="${s}" t="inlineStr"><is><t xml:space="preserve">${xmlEscape(val)}</t></is></c>`;
      }
    });
    sheetRows += `<row r="${r + 1}">${cells}</row>`;
  });

  const colCount = headers.length;
  const colWidths = Array.from({ length: colCount }, (_, c) => {
    const maxLen = allRows.reduce((m, row) => Math.max(m, String(row[c] ?? "").length), 0);
    return Math.min(60, Math.max(8, maxLen + 2));
  });
  const cols = `<cols>${colWidths.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join("")}</cols>`;

  const contentTypes = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`;
  const rootRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`;
  const workbookRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`;
  const workbook = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Sheet1" sheetId="1" r:id="rId1"/></sheets></workbook>`;
  const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="&quot;$&quot;#,##0.00"/></numFmts><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="4"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFC6EFCE"/><bgColor indexed="64"/></patternFill></fill><fill><patternFill patternType="solid"><fgColor rgb="FFFFC7CE"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="10"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="0" fontId="0" fillId="2" borderId="0" xfId="0" applyFill="1"/><xf numFmtId="0" fontId="0" fillId="3" borderId="0" xfId="0" applyFill="1"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="164" fontId="0" fillId="2" borderId="0" xfId="0" applyNumberFormat="1" applyFill="1"/><xf numFmtId="164" fontId="0" fillId="3" borderId="0" xfId="0" applyNumberFormat="1" applyFill="1"/><xf numFmtId="9" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="164" fontId="1" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyFont="1"/><xf numFmtId="9" fontId="1" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyFont="1"/></cellXfs></styleSheet>`;
  const sheet = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">${cols}<sheetData>${sheetRows}</sheetData></worksheet>`;

  const files = [
    { name: "[Content_Types].xml", data: enc.encode(contentTypes) },
    { name: "_rels/.rels", data: enc.encode(rootRels) },

}
function tryDownloadXlsx(filename, headers, rows, styleForCell) {
  const bytes = buildXlsxBytes(headers, rows, styleForCell);
  return tryDownloadBlob(filename, new Blob([bytes], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
}

function TicketCard({ children, accent }) {
  return (
    <div className="relative rounded-md" style={{ background: "var(--surface)", border: "1px dashed var(--hairline)" }}>
      <div className="absolute -left-2 top-1/2 -translate-y-1/2 w-4 h-4 rounded-full" style={{ background: "var(--bg)" }} />
      <div className="absolute -right-2 top-1/2 -translate-y-1/2 w-4 h-4 rounded-full" style={{ background: "var(--bg)" }} />
      {accent && <div className="h-1 rounded-t-md" style={{ background: accent }} />}
      <div className="p-4">{children}</div>
    </div>
  );
}
function Pill({ tone = "muted", children }) {
  const map = {
    win: { bg: "rgba(76,154,106,0.18)", color: "var(--win)" },
    loss: { bg: "rgba(192,82,75,0.18)", color: "var(--loss)" },
    pending: { bg: "rgba(212,175,55,0.15)", color: "var(--gold)" },
    muted: { bg: "rgba(139,148,163,0.15)", color: "var(--muted)" },
  };
  const s = map[tone];
  return (
    <span className="px-2 py-0.5 rounded text-xs font-mono uppercase tracking-wide" style={{ background: s.bg, color: s.color }}>
      {children}
    </span>
  );
}
function Section({ title, children }) {
  return (
    <div>
      <h2 className="display-font text-sm uppercase tracking-wider mb-3" style={{ color: "var(--gold)" }}>{title}</h2>
      {children}
    </div>
  );
}
function EmptyState({ text }) {
  return (
    <div className="text-center py-12 text-sm rounded-md" style={{ color: "var(--muted)", border: "1px dashed var(--hairline)" }}>
      {text}
    </div>
  );
}
function inputStyle() {
  return { background: "var(--bg)", border: "1px solid var(--hairline)", color: "var(--text)" };
}

function PickemLeague() {
  const [loading, setLoading] = useState(true);
  const [seasonLoading, setSeasonLoading] = useState(true);
  const [seasons, setSeasons] = useState({ list: [{ id: "season-1", name: DEFAULT_SEASON_NAME, createdAt: "" }], activeSeasonId: "season-1" });
  const [viewingSeasonId, setViewingSeasonId] = useState("season-1");
  const [meta, setMeta] = useState({ currentWeek: 1 });
  const [roster, setRoster] = useState({ usernames: [], teamNames: {}, locked: false, pinnedCount: null });
  const [weeksData, setWeeksData] = useState({});
  const [picksData, setPicksData] = useState({});
  const [ledger, setLedger] = useState({ adjustments: [] });
  const [comments, setComments] = useState("");
  const [passwords, setPasswords] = useState({});
  const [adminPass, setAdminPass] = useState(null);
  const [adminRecoveryHash, setAdminRecoveryHash] = useState(null);
  const [adminUnlocked, setAdminUnlocked] = useState(false);
  const [identity, setIdentity] = useState("");
  const [teamName, setTeamName] = useState("");
  const [authedUser, setAuthedUser] = useState(null);
  const [pwInput, setPwInput] = useState("");
  const [authMsg, setAuthMsg] = useState("");
  const [tab, setTab] = useState("picks");
  const [historyWeek, setHistoryWeek] = useState(1);
  const [saveMsg, setSaveMsg] = useState("");

  // Global data: loaded once — seasons registry (self-healing if this is the very first run),
  // cross-season passwords, admin password, and this browser's remembered username.
  useEffect(() => {
    (async () => {
      let [s, pw, ap, arh, id] = await Promise.all([
        loadJSON(KEYS.seasons, null),
        loadJSON(KEYS.passwords, {}),
        loadJSON(KEYS.adminPass, null),
        loadJSON(KEYS.adminRecovery, null),
        (async () => { try { const res = await window.storage.get("pickem:my-identity", false); return res ? res.value : ""; } catch { return ""; } })(),
      ]);
      if (!s || !s.list || s.list.length === 0) {
        s = { list: [{ id: "season-1", name: DEFAULT_SEASON_NAME, createdAt: new Date().toISOString() }], activeSeasonId: "season-1" };
        await saveJSON(KEYS.seasons, s);
      }
      setSeasons(s);
      setViewingSeasonId(s.activeSeasonId);
      setPasswords(pw);
      setAdminPass(ap);
      setAdminRecoveryHash(arh);
      setIdentity(id);
      setLoading(false);
    })();
  }, []);

  // Per-season data: reloaded any time the viewed season changes.
  useEffect(() => {
    if (loading) return;
    setSeasonLoading(true);
    const keys = seasonKeys(viewingSeasonId);
    (async () => {
      const [m, r, w, p, l, c] = await Promise.all([
        loadJSON(keys.meta, { currentWeek: 1 }),
        loadJSON(keys.roster, { usernames: [], teamNames: {}, locked: false, pinnedCount: null }),
        loadJSON(keys.weeks, {}),
        loadJSON(keys.picks, {}),
        loadJSON(keys.ledger, { adjustments: [] }),
        loadJSON(keys.comments, ""),
      ]);
      setMeta(m); setRoster(r); setWeeksData(w); setPicksData(p); setLedger(l); setComments(c);
      setHistoryWeek(m.currentWeek);
      setAuthedUser(null);
      setSeasonLoading(false);
    })();
  }, [viewingSeasonId, loading]);

  const flash = (msg) => { setSaveMsg(msg); setTimeout(() => setSaveMsg(""), 2200); };


  const persistRoster = async (next) => { setRoster(next); await saveJSON(seasonKeys(viewingSeasonId).roster, next); };
  const persistWeeks = async (next) => { setWeeksData(next); await saveJSON(seasonKeys(viewingSeasonId).weeks, next); };
  const persistPicks = async (next) => { setPicksData(next); await saveJSON(seasonKeys(viewingSeasonId).picks, next); };
  const persistMeta = async (next) => { setMeta(next); await saveJSON(seasonKeys(viewingSeasonId).meta, next); };
  const persistLedger = async (next) => { setLedger(next); await saveJSON(seasonKeys(viewingSeasonId).ledger, next); };
  const persistComments = async (next) => { setComments(next); await saveJSON(seasonKeys(viewingSeasonId).comments, next); };
  const persistPasswords = async (next) => { setPasswords(next); await saveJSON(KEYS.passwords, next); };
  const persistSeasons = async (next) => { setSeasons(next); await saveJSON(KEYS.seasons, next); };
  const persistAdminPass = async (pw) => { setAdminPass(pw); await saveJSON(KEYS.adminPass, pw); };
  const persistAdminRecoveryHash = async (h) => { setAdminRecoveryHash(h); await saveJSON(KEYS.adminRecovery, h); };
  const persistIdentity = async (name) => {
    setIdentity(name);
    setAuthMsg("");
    setPwInput("");
    if (authedUser && authedUser !== name.trim()) setAuthedUser(null);
    try { await window.storage.set("pickem:my-identity", name, false); } catch {}
  };
  const persistTeamName = async (name) => {
    if (authedUser !== identity.trim()) return;
    setTeamName(name);
    if (identity.trim()) {
      const next = { ...roster, teamNames: { ...roster.teamNames, [identity.trim()]: name } };
      await persistRoster(next);
    }
  };
  const handleUnlockOrClaim = async () => {
    const uname = identity.trim();
    if (!uname) { setAuthMsg("Enter a username first."); return; }
    const existingHash = passwords?.[uname];
    const entered = await sha256Hex(pwInput);
    if (existingHash) {
      if (entered !== existingHash) { setAuthMsg("Wrong password."); return; }
      if (roster.locked && !roster.usernames.includes(uname)) { setAuthMsg("Roster is locked for this season — ask the admin to add you first."); return; }
      if (!roster.usernames.includes(uname)) await persistRoster({ ...roster, usernames: [...roster.usernames, uname] });
      setAuthedUser(uname);
      setAuthMsg("");
    } else {
      if (!pwInput) { setAuthMsg("Set a password to claim this username."); return; }
      if (roster.locked && !roster.usernames.includes(uname)) { setAuthMsg("Roster is locked — ask the admin to add you first."); return; }
      await persistPasswords({ ...(passwords || {}), [uname]: entered });
      if (!roster.usernames.includes(uname)) await persistRoster({ ...roster, usernames: [...roster.usernames, uname] });
      setAuthedUser(uname);
      setAuthMsg("Password set — you're in.");
    }
  };

  const currentWeek = weeksData[meta.currentWeek];
  const currentLocked = isWeekLocked(currentWeek);
  useEffect(() => {
    const uname = identity.trim();
    if (uname && roster.teamNames?.[uname] != null) setTeamName(roster.teamNames[uname]);
    else if (!uname) setTeamName("");
  }, [identity, roster.teamNames]);
  const standings = useMemo(() => computeStandings(roster, weeksData, picksData, ledger), [roster, weeksData, picksData, ledger]);
  const weekPotValue = ENTRY_FEE * (roster.pinnedCount ?? roster.usernames.length) + standings.carryPot;
  const authed = !!authedUser && identity.trim() !== "" && authedUser === identity.trim();
  const hasPasswordSet = !!passwords?.[identity.trim()];
  const viewingSeason = seasons.list.find((s) => s.id === viewingSeasonId) || seasons.list[0];
  const isArchivedSeason = viewingSeasonId !== seasons.activeSeasonId;

  if (loading || seasonLoading) {
    return <div style={{ background: "#0A1628", color: "#F5F7FA" }} className="min-h-[400px] flex items-center justify-center font-mono text-sm">loading the book...</div>;
  }

  return (
    <div style={{ "--bg": "#0A1628", "--surface": "#122C52", "--gold": "#FB4F14", "--win": "#4C9A6A", "--loss": "#C0524B", "--text": "#F5F7FA", "--muted": "#8CA3C4", "--hairline": "#264876", background: "var(--bg)", color: "var(--text)", fontFamily: "'Inter', sans-serif" }} className="min-h-screen w-full">
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap');
        .display-font { font-family: 'Oswald', sans-serif; letter-spacing: 0.02em; }
        .mono-font { font-family: 'JetBrains Mono', monospace; }
        select, input, textarea { color-scheme: dark; }
      `}</style>

      <div className="max-w-3xl mx-auto px-4 py-6">
        <header className="flex flex-wrap items-start justify-between gap-3 mb-4 pb-4" style={{ borderBottom: "1px solid var(--hairline)" }}>
          <div>
            <h1 className="display-font text-2xl font-bold" style={{ color: "var(--gold)" }}>{viewingSeason?.name}</h1>
            {seasons.list.length > 1 && (
              <select value={viewingSeasonId} onChange={(e) => setViewingSeasonId(e.target.value)} className="mt-2 px-2 py-1 rounded text-xs" style={inputStyle()}>
                {seasons.list.map((s) => (
                  <option key={s.id} value={s.id}>{s.name}{s.id === seasons.activeSeasonId ? " (current)" : " (archived)"}</option>
                ))}
              </select>
            )}
          </div>
          <div className="flex flex-col items-end gap-2">
            <div className="flex gap-2">
              <div className="text-right">
                <label className="block text-[10px] uppercase tracking-wider mb-1" style={{ color: "var(--muted)" }}>username</label>
                <input value={identity} onChange={(e) => persistIdentity(e.target.value)} placeholder="username" className="px-2 py-1 rounded text-sm text-right w-28" style={inputStyle()} />
              </div>
              <div className="text-right">
                <label className="block text-[10px] uppercase tracking-wider mb-1" style={{ color: "var(--muted)" }}>team name</label>
                <input disabled={!authed} value={teamName} onChange={(e) => persistTeamName(e.target.value)} placeholder={authed ? "team name" : "unlock to edit"} className="px-2 py-1 rounded text-sm text-right w-28" style={inputStyle()} />
              </div>
            </div>
            {identity.trim() && !authed && (
              <div className="flex items-center gap-2">
                <input
                  type="password" value={pwInput} onChange={(e) => setPwInput(e.target.value)}
                  placeholder={hasPasswordSet ? "password" : "set a password"}
                  onKeyDown={(e) => { if (e.key === "Enter") handleUnlockOrClaim(); }}
                  className="px-2 py-1 rounded text-sm w-32" style={inputStyle()}
                />
                <button onClick={handleUnlockOrClaim} className="px-2 py-1 rounded text-xs display-font" style={{ background: "var(--gold)", color: "#12161C" }}>
                  {hasPasswordSet ? "Unlock" : "Claim"}
                </button>
              </div>
            )}
            {identity.trim() && authed && (
              <div className="flex items-center gap-2">
                <Pill tone="win">unlocked</Pill>
                <button
                  onClick={() => { setAuthedUser(null); setPwInput(""); setAuthMsg("Logged out."); }}
                  className="px-2 py-0.5 rounded text-xs display-font" style={{ background: "var(--surface)", border: "1px solid var(--hairline)", color: "var(--muted)" }}
                >
                  Log out
                </button>
              </div>
            )}
            {authMsg && <p className="text-[11px]" style={{ color: authMsg.includes("set") || authMsg.includes("in") ? "var(--win)" : "var(--loss)" }}>{authMsg}</p>}
          </div>
        </header>

        {isArchivedSeason && (
          <div className="mb-4 text-xs mono-font px-3 py-2 rounded" style={{ background: "rgba(212,175,55,0.12)", color: "var(--gold)" }}>
            Viewing archived season — read-only. Switch to "{seasons.list.find((s) => s.id === seasons.activeSeasonId)?.name}" up top to make picks.
          </div>
        )}

        <nav className="flex gap-1 mb-6 p-1 rounded-md flex-wrap" style={{ background: "var(--surface)" }}>
          {[["picks", "Make Picks"], ["leaderboard", "Season Leaderboard"], ["history", "Weekly History"], ["admin", "Admin"]].map(([id, label]) => (
            <button key={id} onClick={() => { setTab(id); if (id === "history") setHistoryWeek(meta.currentWeek); }} className="tab-btn flex-1 py-2 rounded text-sm font-medium display-font min-w-[80px]" style={tab === id ? { background: "var(--gold)", color: "#12161C" } : { color: "var(--muted)" }}>
              {label}
            </button>
          ))}
        </nav>

        {tab !== "admin" && comments && comments.trim() && (
          <div className="mb-4 p-3 rounded" style={{ background: "var(--surface)", border: "1px solid var(--gold)", whiteSpace: "pre-wrap" }}>
            <p className="text-sm" style={{ color: "var(--text)" }}>{comments}</p>
          </div>
        )}

        {saveMsg && <div className="mb-4 text-xs mono-font px-3 py-2 rounded" style={{ background: "rgba(76,154,106,0.15)", color: "var(--win)" }}>{saveMsg}</div>}

        {tab === "picks" && (
          <PicksTab
            identity={identity} week={currentWeek} weekNum={meta.currentWeek} locked={currentLocked} roster={roster} picksData={picksData} authed={authed} isArchivedSeason={isArchivedSeason} weekPotValue={weekPotValue}
            onSavePicks={async (picks) => {
              if (!authed) return;
              const next = { ...picksData, [meta.currentWeek]: { ...(picksData[meta.currentWeek] || {}), [identity]: picks } };
              await persistPicks(next);
              if (!roster.locked && !roster.usernames.includes(identity.trim()) && identity.trim()) {
                await persistRoster({ ...roster, usernames: [...roster.usernames, identity.trim()] });
              }
              flash("Picks saved.");
            }}
          />
        )}

        {tab === "leaderboard" && <LeaderboardTab standings={standings} />}

        {tab === "history" && <HistoryTab weeksData={weeksData} picksData={picksData} roster={roster} historyWeek={historyWeek} setHistoryWeek={setHistoryWeek} standings={standings} identity={identity} authed={authed} />}

        {tab === "admin" && (
          adminUnlocked ? (
            <AdminTab
              meta={meta} roster={roster} weeksData={weeksData} picksData={picksData} ledger={ledger} standings={standings}
              passwords={passwords} onPasswordsChange={persistPasswords}
              seasons={seasons} onSeasonsChange={persistSeasons} viewingSeasonId={viewingSeasonId} onSwitchSeason={setViewingSeasonId}
              onSetAdminPass={persistAdminPass} onSetAdminRecoveryHash={persistAdminRecoveryHash}
              onSetCurrentWeek={(n) => persistMeta({ ...meta, currentWeek: n })}
              onRosterChange={persistRoster} onWeeksChange={persistWeeks} onPicksChange={persistPicks} onLedgerChange={persistLedger}
              comments={comments} onCommentsChange={persistComments} flash={flash}
            />
          ) : (
            <AdminGate adminPass={adminPass} adminRecoveryHash={adminRecoveryHash} onSetPass={persistAdminPass} onSetRecoveryHash={persistAdminRecoveryHash} onUnlock={() => setAdminUnlocked(true)} />
          )
        )}
      </div>
    </div>
  );
}
